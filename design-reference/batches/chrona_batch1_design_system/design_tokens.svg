  <g id="layer-token-sync-note" transform="translate(48, 744)">
    <rect x="0" y="0" width="1344" height="164" rx="20" fill="#222A38" stroke="#334155"/>
    <text x="28" y="38" class="font-sans" font-size="16" font-weight="600" fill="#F1F5F9">Cross-Batch Token Governance Rules</text>
    <text x="28" y="66" class="font-sans" font-size="13" fill="#94A3B8">1. Never hardcode #000000 onto cards; all card containers bind strictly to color.surface.card (#1A202C) or color.surface.high (#222A38).</text>
    <text x="28" y="90" class="font-sans" font-size="13" fill="#94A3B8">2. Keep color.accent.primary (#93A8C7) reserved for interactive controls, toggles, sliders, and primary pill buttons.</text>
    <text x="28" y="114" class="font-sans" font-size="13" fill="#94A3B8">3. All Batch 2+ screens MUST reference 412×915dp artboards with 20dp horizontal padding yielding 372dp full-bleed card widths.</text>
    <text x="28" y="138" class="font-mono" font-size="12" fill="#93A8C7">Machine-readable artifact: tokens.json (W3C Design Tokens Format)</text>
  </g>
</svg>