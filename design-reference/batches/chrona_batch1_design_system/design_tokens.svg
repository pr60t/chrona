    <text x="132" y="66" text-anchor="middle" class="font-sans" font-size="11" font-weight="600" letter-spacing="1.2" fill="#DCE6F7">05 · DESIGN TOKENS</text>
    <text x="48" y="112" class="font-sans" font-size="30" font-weight="600" fill="#F1F5F9">Token Taxonomy &amp; Component Mapping</text>
    <text x="48" y="138" class="font-sans" font-size="14" fill="#94A3B8">Single source of truth synced with tokens.json · Semantic aliases isolate theme switching (AMOLED vs Light)</text>
    <text x="1392" y="72" text-anchor="end" class="font-mono" font-size="12" fill="#64748B">CHRONA DESIGN SYSTEM · v1.0</text>
    <text x="1392" y="92" text-anchor="end" class="font-mono" font-size="11" fill="#93A8C7">360dp Component Grid · 412×915dp Screen Standard</text>
    <line x1="48" y1="158" x2="1392" y2="158" stroke="#1E293B" stroke-width="1"/>
  </g><g id="layer-token-tiers" transform="translate(48, 184)">
