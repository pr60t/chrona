<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 960" width="1440" height="960">
  <title>CHRONA — Brand Overview &amp; Visual Identity</title>
  <desc>Foundational brand direction, visual DNA extracted from reference, and layout standards.</desc>
  <defs>
    <style>
      .font-sans { font-family: Google Sans, Roboto, -apple-system, BlinkMacSystemFont, sans-serif; }
      .font-mono { font-family: Roboto Mono, monospace; }
      .tnum { font-variant-numeric: tabular-nums; }
    </style>
    <!-- Procedural City Skyline Gradients &amp; Silhouettes for Replaceable City Tiles -->
    <linearGradient id="sky-warsaw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3E4C63"/>
      <stop offset="55%" stop-color="#8C7A7B"/>
      <stop offset="100%" stop-color="#D4A68A"/>
    </linearGradient>
    <linearGradient id="sky-london" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5D7491"/>
      <stop offset="60%" stop-color="#9EB1C7"/>
      <stop offset="100%" stop-color="#C9D4E0"/>
    </linearGradient>
    <linearGradient id="sky-boston" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A4961"/>
      <stop offset="60%" stop-color="#7D6B7D"/>
      <stop offset="100%" stop-color="#C98A7A"/>
    </linearGradient>
    <linearGradient id="sky-perth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A5D75"/>
      <stop offset="55%" stop-color="#939BA8"/>
      <stop offset="100%" stop-color="#D8C2B0"/>
    </linearGradient>
    <clipPath id="clip-city-tile">
      <rect x="0" y="0" width="80" height="64" rx="12" ry="12"/>
    </clipPath>
    <clipPath id="clip-city-tile-sm">
      <rect x="0" y="0" width="68" height="54" rx="10" ry="10"/>
    </clipPath>
  </defs>
  <g id="layer-background">
    <rect x="0" y="0" width="1440" height="960" fill="#000000"/>
    <rect x="24" y="24" width="1392" height="912" rx="28" fill="#080B10" stroke="#1E293B" stroke-width="1"/>
  </g>
  <g id="layer-header">
    <rect x="48" y="48" width="168" height="28" rx="14" fill="#2A384D"/>
    <text x="132" y="66" text-anchor="middle" class="font-sans" font-size="11" font-weight="600" letter-spacing="1.2" fill="#DCE6F7">01 · BRAND IDENTITY</text>
    <text x="48" y="112" class="font-sans" font-size="30" font-weight="600" fill="#F1F5F9">CHRONA Visual Identity &amp; Architecture</text>
    <text x="48" y="138" class="font-sans" font-size="14" fill="#94A3B8">Google Pixel-inspired Material Design 3 · Pitch-black AMOLED (#000000) · Atmospheric deep blue-gray elevation</text>
    <text x="1392" y="72" text-anchor="end" class="font-mono" font-size="12" fill="#64748B">CHRONA DESIGN SYSTEM · v1.0</text>
    <text x="1392" y="92" text-anchor="end" class="font-mono" font-size="11" fill="#93A8C7">360dp Component Grid · 412×915dp Screen Standard</text>
    <line x1="48" y1="158" x2="1392" y2="158" stroke="#1E293B" stroke-width="1"/>
  </g>
  <g id="layer-brand-pillars" transform="translate(48, 184)">
    <rect x="0" y="0" width="640" height="340" rx="20" fill="#1A202C" stroke="#1E293B" stroke-width="1"/>
    <text x="28" y="38" class="font-sans" font-size="18" font-weight="600" fill="#F1F5F9">Product Essence &amp; Aesthetic DNA</text>
    <text x="28" y="62" class="font-sans" font-size="13" fill="#94A3B8">Native Android smart clock &amp; cross-timezone orchestrator</text>
    
    <g transform="translate(28, 86)">
      <rect x="0" y="0" width="282" height="104" rx="16" fill="#222A38"/>
      <circle cx="24" cy="28" r="8" fill="#000000" stroke="#334155" stroke-width="1.5"/>
      <text x="44" y="33" class="font-sans" font-size="14" font-weight="600" fill="#F1F5F9">True AMOLED Pitch Black</text>
      <text x="16" y="58" class="font-sans" font-size="12" fill="#94A3B8">Canvas anchored at #000000 for zero</text>
      <text x="16" y="76" class="font-sans" font-size="12" fill="#94A3B8">pixel glow in bedside &amp; night use.</text>
    </g>

    <g transform="translate(330, 86)">
      <rect x="0" y="0" width="282" height="104" rx="16" fill="#222A38"/>
      <rect x="16" y="20" width="16" height="16" rx="4" fill="#1A202C" stroke="#93A8C7" stroke-width="1.5"/>
      <text x="44" y="33" class="font-sans" font-size="14" font-weight="600" fill="#F1F5F9">Blue-Gray Surface Depth</text>
      <text x="16" y="58" class="font-sans" font-size="12" fill="#94A3B8">Cards use #1A202C–#2B3547 tonal</text>
      <text x="16" y="76" class="font-sans" font-size="12" fill="#94A3B8">steps—never pure black cards.</text>
    </g>

    <g transform="translate(28, 206)">
      <rect x="0" y="0" width="282" height="104" rx="16" fill="#222A38"/>
      <rect x="16" y="18" width="4" height="20" rx="2" fill="#A7E8D8"/>
      <rect x="23" y="18" width="4" height="20" rx="2" fill="#B8C7F2"/>
      <rect x="30" y="18" width="4" height="20" rx="2" fill="#F4C2A1"/>
      <text x="44" y="33" class="font-sans" font-size="14" font-weight="600" fill="#F1F5F9">Dual Chromatic Separation</text>
      <text x="16" y="58" class="font-sans" font-size="12" fill="#94A3B8">Periwinkle UI controls (#93A8C7) stay</text>
      <text x="16" y="76" class="font-sans" font-size="12" fill="#94A3B8">distinct from 8 pastel TZ markers.</text>
    </g>

    <g transform="translate(330, 206)">
      <rect x="0" y="0" width="282" height="104" rx="16" fill="#222A38"/>
      <text x="16" y="33" class="font-mono tnum" font-size="15" font-weight="600" fill="#93A8C7">21:06</text>
      <text x="72" y="33" class="font-sans" font-size="14" font-weight="600" fill="#F1F5F9">Tabular Precision</text>
      <text x="16" y="58" class="font-sans" font-size="12" fill="#94A3B8">Pixel-inspired geometric sans with</text>
      <text x="16" y="76" class="font-sans" font-size="12" fill="#94A3B8">fixed-width numerals prevent jitter.</text>
    </g>
  </g>

  <g id="layer-architecture-rules" transform="translate(48, 548)">
    <rect x="0" y="0" width="640" height="364" rx="20" fill="#1A202C" stroke="#1E293B" stroke-width="1"/>
    <text x="28" y="38" class="font-sans" font-size="18" font-weight="600" fill="#F1F5F9">Viewport, Grid &amp; Navigation Standards</text>
    <text x="28" y="62" class="font-sans" font-size="13" fill="#94A3B8">Mandatory architectural constraints for Batch 2+ screens</text>

    <!-- Grid Metrics -->
    <g transform="translate(28, 84)">
      <rect x="0" y="0" width="184" height="84" rx="14" fill="#11161F" stroke="#1E293B"/>
      <text x="16" y="26" class="font-mono" font-size="11" fill="#94A3B8">COMPONENT GRID</text>
      <text x="16" y="52" class="font-sans tnum" font-size="22" font-weight="600" fill="#F1F5F9">360 dp</text>
      <text x="16" y="70" class="font-sans" font-size="11" fill="#64748B">Reference library base</text>

      <rect x="200" y="0" width="184" height="84" rx="14" fill="#11161F" stroke="#93A8C7" stroke-width="1"/>
      <text x="216" y="26" class="font-mono" font-size="11" fill="#93A8C7">SCREEN ARTBOARD</text>
      <text x="216" y="52" class="font-sans tnum" font-size="22" font-weight="600" fill="#F1F5F9">412 × 915</text>
      <text x="216" y="70" class="font-sans" font-size="11" fill="#64748B">Logical dp (Batch 2+)</text>

      <rect x="400" y="0" width="184" height="84" rx="14" fill="#11161F" stroke="#1E293B"/>
      <text x="416" y="26" class="font-mono" font-size="11" fill="#94A3B8">CARD WIDTH</text>
      <text x="416" y="52" class="font-sans tnum" font-size="22" font-weight="600" fill="#F1F5F9">372 dp</text>
      <text x="416" y="70" class="font-sans" font-size="11" fill="#64748B">20dp side margins</text>
    </g>

    <!-- 5-Destination Nav Rule -->
    <g transform="translate(28, 188)">
      <text x="0" y="16" class="font-sans" font-size="13" font-weight="600" fill="#F1F5F9">Mandatory 5-Destination Bottom Bar (Evenly Distributed)</text>
      <rect x="0" y="28" width="584" height="58" rx="16" fill="#11161F" stroke="#1E293B"/>
      <text x="58" y="61" text-anchor="middle" class="font-sans" font-size="12" fill="#94A3B8">1. Alarms</text>
      <rect x="128" y="38" width="96" height="38" rx="19" fill="#2A384D"/>
      <text x="176" y="61" text-anchor="middle" class="font-sans" font-size="12" font-weight="600" fill="#DCE6F7">2. World Clock</text>
      <text x="292" y="61" text-anchor="middle" class="font-sans" font-size="12" fill="#94A3B8">3. Timer</text>
      <text x="408" y="61" text-anchor="middle" class="font-sans" font-size="12" fill="#94A3B8">4. Stopwatch</text>
      <text x="524" y="61" text-anchor="middle" class="font-sans" font-size="12" fill="#94A3B8">5. Bedtime</text>
    </g>

    <!-- Overflow Menu Standard -->
    <g transform="translate(28, 294)">
      <text x="0" y="16" class="font-sans" font-size="13" font-weight="600" fill="#F1F5F9">Global 3-Dot Overflow Menu Items:</text>
      <rect x="235" y="-2" width="92" height="28" rx="14" fill="#222A38"/>
      <text x="281" y="16" text-anchor="middle" class="font-sans" font-size="12" fill="#F1F5F9">Settings</text>
      <rect x="337" y="-2" width="110" height="28" rx="14" fill="#222A38"/>
      <text x="392" y="16" text-anchor="middle" class="font-sans" font-size="12" fill="#F1F5F9">Screensaver</text>
      <rect x="457" y="-2" width="84" height="28" rx="14" fill="#222A38"/>
      <text x="499" y="16" text-anchor="middle" class="font-sans" font-size="12" fill="#F1F5F9">About</text>
    </g>
  </g>

  <g id="layer-reference-specimen" transform="translate(720, 184)">
    <rect x="0" y="0" width="672" height="728" rx="20" fill="#1A202C" stroke="#1E293B" stroke-width="1"/>
    <text x="28" y="38" class="font-sans" font-size="18" font-weight="600" fill="#F1F5F9">Reference Visual Synthesis</text>
    <text x="28" y="62" class="font-sans" font-size="13" fill="#94A3B8">Canonical anatomy of the Chrona World Clock card &amp; atmospheric canvas</text>

