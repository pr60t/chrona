    <g transform="translate(130, 86)">
      <rect x="0" y="0" width="412" height="616" rx="36" fill="#000000" stroke="#334155" stroke-width="2"/>
      <!-- Status Bar -->
      <text x="28" y="32" class="font-sans tnum" font-size="13" font-weight="600" fill="#F1F5F9">21:06</text>
      <circle cx="354" cy="27" r="4" fill="#F1F5F9"/>
      <rect x="366" y="22" width="18" height="10" rx="2" fill="#F1F5F9"/>
      <!-- Top App Bar -->
      <path d="M32 64 L26 70 L32 76" fill="none" stroke="#F1F5F9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="380" cy="64" r="1.5" fill="#F1F5F9"/>
      <circle cx="380" cy="70" r="1.5" fill="#F1F5F9"/>
      <circle cx="380" cy="76" r="1.5" fill="#F1F5F9"/>

      <!-- Stylised World Map Silhouette -->
      <g transform="translate(36, 92)" opacity="0.95">
        <path d="M22,22 L58,14 L84,26 L76,48 L52,58 L46,84 L34,78 L30,52 L16,38 Z" fill="#242C3A"/>
        <path d="M64,66 L88,72 L96,104 L78,132 L66,118 L60,88 Z" fill="#242C3A"/>
        <path d="M148,18 L192,14 L208,34 L182,46 L152,42 Z" fill="#242C3A"/>
        <path d="M150,50 L188,52 L198,86 L176,118 L158,106 L146,74 Z" fill="#242C3A"/>
        <path d="M198,16 L286,18 L314,44 L276,68 L224,64 L204,42 Z" fill="#242C3A"/>
        <path d="M276,88 L312,92 L316,116 L284,118 Z" fill="#242C3A"/>
        <!-- Glowing Timezone Pins -->
        <circle cx="68" cy="40" r="4.5" fill="#F4C2A1"/>
        <circle cx="158" cy="32" r="4.5" fill="#B8C7F2"/>
        <circle cx="174" cy="30" r="4.5" fill="#A7E8D8"/>
        <circle cx="284" cy="106" r="4.5" fill="#D4B8F0"/>
      </g>

      <!-- 372dp Cards with 20dp Side Margins -->
      <g transform="translate(20, 232)">
        <!-- Card 1: Warsaw -->
        <rect x="0" y="0" width="372" height="80" rx="20" fill="#1A202C"/>
        <g id="city-tile-warsaw" transform="translate(8,8)">
      <rect x="0" y="0" width="80" height="64" rx="12" fill="url(#sky-warsaw)"/>
      <g clip-path="url(#clip-city-tile)">
        <rect x="0" y="42" width="80" height="22" fill="#2A2630"/>
        <rect x="10" y="28" width="12" height="36" fill="#36303D"/>
        <rect x="33" y="14" width="14" height="50" fill="#241F29"/>
        <polygon points="37,14 40,4 43,14" fill="#241F29"/>
        <rect x="52" y="24" width="16" height="40" fill="#312B38"/>
        <rect x="24" y="34" width="8" height="30" fill="#423A4A"/>
        </g>
    </g>
        <rect x="96" y="8" width="4" height="64" rx="2" fill="#A7E8D8"/>
        <text x="112" y="34" class="font-sans" font-size="13" fill="#94A3B8">Poland (GMT +0)</text>
        <text x="112" y="58" class="font-sans" font-size="18" font-weight="600" fill="#F1F5F9">Warsaw</text>
        <text x="352" y="48" text-anchor="end" class="font-sans tnum" font-size="22" font-weight="500" fill="#F1F5F9">21:06</text>

        <!-- Card 2: London -->
        <g transform="translate(0, 92)">
          <rect x="0" y="0" width="372" height="80" rx="20" fill="#1A202C"/>
          <g id="city-tile-london" transform="translate(8,8)">
      <rect x="0" y="0" width="80" height="64" rx="12" fill="url(#sky-london)"/>
      <g clip-path="url(#clip-city-tile)">
        <rect x="0" y="44" width="80" height="20" fill="#435366"/>
        <rect x="8" y="16" width="16" height="32" fill="#324052"/>
        <rect x="30" y="24" width="12" height="24" fill="#3D4D61"/>
        <polygon points="52,48 58,18 64,48" fill="#2C394A"/>
        <line x1="0" y1="45" x2="80" y2="45" stroke="#8CA1BA" stroke-width="1"/>
        </g>
    </g>
          <rect x="96" y="8" width="4" height="64" rx="2" fill="#B8C7F2"/>
          <text x="112" y="34" class="font-sans" font-size="13" fill="#94A3B8">England (GMT -1)</text>
          <text x="112" y="58" class="font-sans" font-size="18" font-weight="600" fill="#F1F5F9">London</text>
          <text x="352" y="48" text-anchor="end" class="font-sans tnum" font-size="22" font-weight="500" fill="#F1F5F9">20:06</text>
        </g>

        <!-- Card 3: Boston -->
        <g transform="translate(0, 184)">
          <rect x="0" y="0" width="372" height="80" rx="20" fill="#1A202C"/>
          <g id="city-tile-boston" transform="translate(8,8)">
      <rect x="0" y="0" width="80" height="64" rx="12" fill="url(#sky-boston)"/>
      <g clip-path="url(#clip-city-tile)">
        <rect x="0" y="44" width="80" height="20" fill="#262533"/>
        <rect x="12" y="22" width="14" height="42" fill="#343245"/>
        <rect x="30" y="14" width="16" height="50" fill="#282636"/>
        <rect x="50" y="26" width="14" height="38" fill="#3B384D"/>
        <rect x="6" y="34" width="8" height="30" fill="#464259"/>
        </g>
    </g>
          <rect x="96" y="8" width="4" height="64" rx="2" fill="#F4C2A1"/>
          <text x="112" y="34" class="font-sans" font-size="13" fill="#94A3B8">United States (GMT -6)</text>
          <text x="112" y="58" class="font-sans" font-size="18" font-weight="600" fill="#F1F5F9">Boston</text>
          <text x="352" y="48" text-anchor="end" class="font-sans tnum" font-size="22" font-weight="500" fill="#F1F5F9">15:06</text>
        </g>

        <!-- Primary Pill CTA -->
        <g transform="translate(0, 286)">
          <rect x="0" y="0" width="372" height="52" rx="26" fill="#93A8C7"/>
          <text x="186" y="31" text-anchor="middle" class="font-sans" font-size="15" font-weight="600" fill="#0B1320">+  Add place</text>
        </g>
      </g>
    </g>
  </g>
</svg>