<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 960" width="1440" height="960">
  <title>CHRONA — Buttons, Inputs &amp; Interactive Controls</title>
  <desc>Primary pill buttons, secondary buttons, icon buttons, search fields, toggles, and weekday selectors across states.</desc>
  <defs>
    <style>
      .font-sans { font-family: Google Sans, Roboto, -apple-system, BlinkMacSystemFont, sans-serif; }
      .font-mono { font-family: Roboto Mono, monospace; }
      .tnum { font-variant-numeric: tabular-nums; }
    </style>
    <!-- Procedural City Skyline Gradients &amp; Silhouettes for Replaceable City Tiles -->
    <linearGradient id="sky-warsaw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3E4C63"/>
      <stop offset="55%" stop-color="#8C7A7B"/>
      <stop offset="100%" stop-color="#D4A68A"/>
    </linearGradient>
    <linearGradient id="sky-london" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5D7491"/>
      <stop offset="60%" stop-color="#9EB1C7"/>
      <stop offset="100%" stop-color="#C9D4E0"/>
    </linearGradient>
    <linearGradient id="sky-boston" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A4961"/>
      <stop offset="60%" stop-color="#7D6B7D"/>
      <stop offset="100%" stop-color="#C98A7A"/>
    </linearGradient>
    <linearGradient id="sky-perth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A5D75"/>
      <stop offset="55%" stop-color="#939BA8"/>
      <stop offset="100%" stop-color="#D8C2B0"/>
    </linearGradient>
    <clipPath id="clip-city-tile">
      <rect x="0" y="0" width="80" height="64" rx="12" ry="12"/>
    </clipPath>
    <clipPath id="clip-city-tile-sm">
      <rect x="0" y="0" width="68" height="54" rx="10" ry="10"/>
    </clipPath>
  </defs>
  <g id="layer-background">
    <rect x="0" y="0" width="1440" height="960" fill="#000000"/>
    <rect x="24" y="24" width="1392" height="912" rx="28" fill="#080B10" stroke="#1E293B" stroke-width="1"/>
  </g>
  <g id="layer-header">
    <rect x="48" y="48" width="168" height="28" rx="14" fill="#2A384D"/>
    <text x="132" y="66" text-anchor="middle" class="font-sans" font-size="11" font-weight="600" letter-spacing="1.2" fill="#DCE6F7">07 · BUTTONS &amp; INPUTS</text>
    <text x="48" y="112" class="font-sans" font-size="30" font-weight="600" fill="#F1F5F9">Interactive Controls &amp; State Variants</text>
    <text x="48" y="138" class="font-sans" font-size="14" fill="#94A3B8">360dp component reference scale · Enabled, Pressed, Selected, Active &amp; Disabled states</text>
    <text x="1392" y="72" text-anchor="end" class="font-mono" font-size="12" fill="#64748B">CHRONA DESIGN SYSTEM · v1.0</text>
    <text x="1392" y="92" text-anchor="end" class="font-mono" font-size="11" fill="#93A8C7">360dp Component Grid · 412×915dp Screen Standard</text>
    <line x1="48" y1="158" x2="1392" y2="158" stroke="#1E293B" stroke-width="1"/>
  </g><g id="layer-primary-buttons" transform="translate(48, 184)">
  <text x="0" y="18" class="font-sans" font-size="16" font-weight="600" fill="#F1F5F9">A. Primary Pill Button (320dp / 372dp Full-Width)</text>
  <g id="btn-primary-0" transform="translate(0, 36)" opacity="1.0">
    <text x="0" y="14" class="font-mono" font-size="11" fill="#94A3B8">Enabled (Default)</text>
    <rect x="0" y="22" width="360" height="52" rx="26" fill="#93A8C7" stroke="none" stroke-width="1.5"/>
    <g id="icon-add" transform="translate(122,36) scale(0.917)" fill="none" stroke="#0B1320" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></g>
    <text x="192" y="53" text-anchor="middle" class="font-sans" font-size="15" font-weight="600" fill="#0B1320">Add place</text>
  </g>
  <g id="btn-primary-1" transform="translate(0, 120)" opacity="1.0">
    <text x="0" y="14" class="font-mono" font-size="11" fill="#94A3B8">Pressed / Focused</text>
    <rect x="0" y="22" width="360" height="52" rx="26" fill="#A8BBD6" stroke="#F1F5F9" stroke-width="1.5"/>
    <g id="icon-add" transform="translate(122,36) scale(0.917)" fill="none" stroke="#0B1320" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></g>
    <text x="192" y="53" text-anchor="middle" class="font-sans" font-size="15" font-weight="600" fill="#0B1320">Add place</text>
  </g>
  <g id="btn-primary-2" transform="translate(0, 204)" opacity="0.75">
    <text x="0" y="14" class="font-mono" font-size="11" fill="#94A3B8">Disabled</text>
    <rect x="0" y="22" width="360" height="52" rx="26" fill="#2A3240" stroke="none" stroke-width="1.5"/>
    <g id="icon-add" transform="translate(122,36) scale(0.917)" fill="none" stroke="#64748B" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></g>
    <text x="192" y="53" text-anchor="middle" class="font-sans" font-size="15" font-weight="600" fill="#64748B">Add place</text>
  </g>
</g>
<g id="layer-secondary-buttons" transform="translate(456, 184)">
  <text x="0" y="18" class="font-sans" font-size="16" font-weight="600" fill="#F1F5F9">B. Secondary &amp; Tonal Action Buttons</text>
  <g id="btn-secondary-0" transform="translate(0, 36)">
    <text x="0" y="14" class="font-mono" font-size="11" fill="#94A3B8">Secondary Tonal · Enabled</text>
    <rect x="0" y="22" width="220" height="48" rx="24" fill="#222A38" stroke="#334155" stroke-width="1"/>
    <text x="110" y="51" text-anchor="middle" class="font-sans" font-size="14" font-weight="600" fill="#F1F5F9">Reset Stopwatch</text>
  </g>
  <g id="btn-secondary-1" transform="translate(0, 120)">
    <text x="0" y="14" class="font-mono" font-size="11" fill="#94A3B8">Secondary Tonal · Active</text>
    <rect x="0" y="22" width="220" height="48" rx="24" fill="#2A384D" stroke="#93A8C7" stroke-width="1"/>
    <text x="110" y="51" text-anchor="middle" class="font-sans" font-size="14" font-weight="600" fill="#DCE6F7">Reset Stopwatch</text>
  </g>
  <g id="btn-secondary-2" transform="translate(0, 204)">
    <text x="0" y="14" class="font-mono" font-size="11" fill="#94A3B8">Secondary · Disabled</text>
    <rect x="0" y="22" width="220" height="48" rx="24" fill="#11161F" stroke="#1E293B" stroke-width="1"/>
    <text x="110" y="51" text-anchor="middle" class="font-sans" font-size="14" font-weight="600" fill="#64748B">Reset Stopwatch</text>
  </g>
</g>
<g id="layer-icon-buttons-toggles" transform="translate(740, 184)">
  <text x="0" y="18" class="font-sans" font-size="16" font-weight="600" fill="#F1F5F9">C. Icon Buttons (48×48dp) &amp; M3 Switches</text>
  <g id="icon-btn-0" transform="translate(0, 38)">
    <rect x="0" y="0" width="48" height="48" rx="24" fill="#222A38" stroke="none" stroke-width="1.5"/>
    <g id="icon-alarm" transform="translate(12,12) scale(1.000)" fill="none" stroke="#F1F5F9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 1.5M5 3L2 6M22 6l-3-3M6.5 19.5L5 21M17.5 19.5L19 21"/></g>
    <text x="60" y="28" class="font-mono" font-size="11" fill="#94A3B8">Default</text>
  </g>
  <g id="icon-btn-1" transform="translate(160, 38)">
    <rect x="0" y="0" width="48" height="48" rx="24" fill="#2A384D" stroke="#93A8C7" stroke-width="1.5"/>
    <g id="icon-alarm" transform="translate(12,12) scale(1.000)" fill="none" stroke="#DCE6F7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 1.5M5 3L2 6M22 6l-3-3M6.5 19.5L5 21M17.5 19.5L19 21"/></g>
    <text x="60" y="28" class="font-mono" font-size="11" fill="#94A3B8">Selected</text>
  </g>
  <g id="icon-btn-2" transform="translate(320, 38)">
    <rect x="0" y="0" width="48" height="48" rx="24" fill="#2B3547" stroke="#F1F5F9" stroke-width="1.5"/>
    <g id="icon-alarm" transform="translate(12,12) scale(1.000)" fill="none" stroke="#F1F5F9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 1.5M5 3L2 6M22 6l-3-3M6.5 19.5L5 21M17.5 19.5L19 21"/></g>
    <text x="60" y="28" class="font-mono" font-size="11" fill="#94A3B8">Pressed</text>
  </g>
  <g id="icon-btn-3" transform="translate(480, 38)">
    <rect x="0" y="0" width="48" height="48" rx="24" fill="#11161F" stroke="none" stroke-width="1.5"/>
    <g id="icon-alarm" transform="translate(12,12) scale(1.000)" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 1.5M5 3L2 6M22 6l-3-3M6.5 19.5L5 21M17.5 19.5L19 21"/></g>
    <text x="60" y="28" class="font-mono" font-size="11" fill="#94A3B8">Disabled</text>
  </g>
  <g id="toggle-0" transform="translate(0, 124)">
    <rect x="0" y="0" width="52" height="32" rx="16" fill="#93A8C7" stroke="none" stroke-width="1.5"/>
    <circle cx="38" cy="16" r="11" fill="#0B1320"/>
    <text x="64" y="20" class="font-mono" font-size="11" fill="#94A3B8">Active / On</text>
  </g>
  <g id="toggle-1" transform="translate(215, 124)">
    <rect x="0" y="0" width="52" height="32" rx="16" fill="#2B3547" stroke="#334155" stroke-width="1.5"/>
    <circle cx="22" cy="16" r="8" fill="#94A3B8"/>
    <text x="64" y="20" class="font-mono" font-size="11" fill="#94A3B8">Inactive / Off</text>
  </g>
  <g id="toggle-2" transform="translate(430, 124)">
    <rect x="0" y="0" width="52" height="32" rx="16" fill="#2A3240" stroke="none" stroke-width="1.5"/>
    <circle cx="38" cy="16" r="11" fill="#64748B"/>
    <text x="64" y="20" class="font-mono" font-size="11" fill="#94A3B8">Disabled On</text>
  </g>
  <g id="component-weekday-selector" transform="translate(0, 194)">
    <text x="0" y="14" class="font-mono" font-size="11" fill="#94A3B8">Weekday Selector (Selected vs Unselected)</text>
    <g transform="translate(0, 24)">
      <circle cx="20" cy="20" r="20" fill="#222A38" stroke="#334155"/>
      <text x="20" y="25" text-anchor="middle" class="font-sans" font-size="13" font-weight="600" fill="#94A3B8">S</text>
    </g>
    <g transform="translate(48, 24)">
      <circle cx="20" cy="20" r="20" fill="#93A8C7" stroke="none"/>
      <text x="20" y="25" text-anchor="middle" class="font-sans" font-size="13" font-weight="600" fill="#0B1320">M</text>
    </g>
    <g transform="translate(96, 24)">
      <circle cx="20" cy="20" r="20" fill="#93A8C7" stroke="none"/>
      <text x="20" y="25" text-anchor="middle" class="font-sans" font-size="13" font-weight="600" fill="#0B1320">T</text>
    </g>
    <g transform="translate(144, 24)">
      <circle cx="20" cy="20" r="20" fill="#93A8C7" stroke="none"/>
      <text x="20" y="25" text-anchor="middle" class="font-sans" font-size="13" font-weight="600" fill="#0B1320">W</text>
    </g>
    <g transform="translate(192, 24)">
      <circle cx="20" cy="20" r="20" fill="#93A8C7" stroke="none"/>
      <text x="20" y="25" text-anchor="middle" class="font-sans" font-size="13" font-weight="600" fill="#0B1320">T</text>
    </g>
    <g transform="translate(240, 24)">
      <circle cx="20" cy="20" r="20" fill="#93A8C7" stroke="none"/>
      <text x="20" y="25" text-anchor="middle" class="font-sans" font-size="13" font-weight="600" fill="#0B1320">F</text>
    </g>
    <g transform="translate(288, 24)">
      <circle cx="20" cy="20" r="20" fill="#222A38" stroke="#334155"/>
      <text x="20" y="25" text-anchor="middle" class="font-sans" font-size="13" font-weight="600" fill="#94A3B8">S</text>
    </g>
  </g>
</g>
<g id="layer-search-fields" transform="translate(48, 520)">
  <text x="0" y="18" class="font-sans" font-size="16" font-weight="600" fill="#F1F5F9">D. Search Field Component (360dp Reference Width)</text>
  <g id="search-field-0" transform="translate(0, 38)">
    <text x="0" y="12" class="font-mono" font-size="11" fill="#94A3B8">Enabled · Empty Placeholder</text>
    <rect x="0" y="22" width="428" height="52" rx="26" fill="#222A38" stroke="#334155" stroke-width="1.5"/>
    <g id="icon-search" transform="translate(16,36) scale(0.917)" fill="none" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></g>
    <text x="50" y="53" class="font-sans" font-size="14" fill="#94A3B8">Search city, country, or timezone...</text>
    
  </g>
  <g id="search-field-1" transform="translate(452, 38)">
    <text x="0" y="12" class="font-mono" font-size="11" fill="#94A3B8">Active / Focused · Query Entered</text>
    <rect x="0" y="22" width="428" height="52" rx="26" fill="#2B3547" stroke="#93A8C7" stroke-width="1.5"/>
    <g id="icon-search" transform="translate(16,36) scale(0.917)" fill="none" stroke="#93A8C7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></g>
    <text x="50" y="53" class="font-sans" font-size="14" fill="#F1F5F9">Tokyo, Japan (JST)</text>
    <g id="icon-close" transform="translate(388,36) scale(0.833)" fill="none" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></g>
  </g>
  <g id="search-field-2" transform="translate(904, 38)">
    <text x="0" y="12" class="font-mono" font-size="11" fill="#94A3B8">Disabled</text>
    <rect x="0" y="22" width="428" height="52" rx="26" fill="#11161F" stroke="#1E293B" stroke-width="1.5"/>
    <g id="icon-search" transform="translate(16,36) scale(0.917)" fill="none" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></g>
    <text x="50" y="53" class="font-sans" font-size="14" fill="#94A3B8">Offline search unavailable</text>
    
  </g>
</g>

  <g transform="translate(48, 690)">
    <rect x="0" y="0" width="1344" height="190" rx="20" fill="#1A202C" stroke="#1E293B"/>
    <text x="24" y="36" class="font-sans" font-size="16" font-weight="600" fill="#F1F5F9">Interactive Feedback &amp; Pixel Touch Standards</text>
    <text x="24" y="66" class="font-sans" font-size="13" fill="#94A3B8">• Primary Pill CTA (+ Add place) uses full stadium geometry (rx=9999dp), 52dp height, desaturated periwinkle fill (#93A8C7), and high-contrast #0B1320 ink.</text>
    <text x="24" y="92" class="font-sans" font-size="13" fill="#94A3B8">• Pressed states increase surface luminance by +8% tonal shift (#A8BBD6 on primary, #2B3547 on dark surfaces) with Material 3 ripple feedback.</text>
    <text x="24" y="118" class="font-sans" font-size="13" fill="#94A3B8">• All interactive controls enforce a minimum 48×48dp touch bounding box with at least 8dp separation between adjacent hit targets.</text>
    <text x="24" y="144" class="font-mono" font-size="12" fill="#93A8C7">Responsive Scaling: 320dp on 360dp grid → 372dp on 412dp screen artboard (20dp horizontal margins).</text>
  </g>
</svg>