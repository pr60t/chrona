    <rect x="52" y="18" width="220" height="96" rx="20" fill="#1A202C" stroke="#93A8C7" stroke-width="1.2"/>
    <text x="16" y="136" class="font-sans" font-size="14" font-weight="600" fill="#F1F5F9">Card Container</text>
    <text x="16" y="154" class="font-mono" font-size="11" fill="#93A8C7">radius: 20dp</text>
    <text x="16" y="170" class="font-sans" font-size="11" fill="#94A3B8">372 × 80dp (on 412dp screen)</text>
  </g>
  <g transform="translate(340, 34)">
