  <rect x="0" y="32" width="660" height="260" rx="18" fill="#1A202C" stroke="#1E293B"/>
  <g transform="translate(18, 48)">
    <rect x="0" y="0" width="624" height="38" rx="10" fill="#000000" stroke="#334155" stroke-width="1"/>
    <text x="14" y="24" class="font-sans" font-size="12" font-weight="600" fill="#F1F5F9">Level 0 · Canvas</text>
    <text x="175" y="24" class="font-mono" font-size="11" fill="#93A8C7">#000000</text>
    <text x="255" y="24" class="font-sans" font-size="11" fill="#94A3B8">Pitch-black AMOLED screen background</text>
    <text x="610" y="24" text-anchor="end" class="font-mono" font-size="10" fill="#64748B">No shadow</text>
  </g>
  <g transform="translate(18, 94)">
    <rect x="0" y="0" width="624" height="38" rx="10" fill="#11161F" stroke="#334155" stroke-width="1"/>
    <text x="14" y="24" class="font-sans" font-size="12" font-weight="600" fill="#F1F5F9">Level 1 · Low Surface</text>
    <text x="175" y="24" class="font-mono" font-size="11" fill="#93A8C7">#11161F</text>
    <text x="255" y="24" class="font-sans" font-size="11" fill="#94A3B8">Bottom navigation bar &amp; recessed wells</text>
    <text x="610" y="24" text-anchor="end" class="font-mono" font-size="10" fill="#64748B">1dp hairline top border</text>
  </g>
  <g transform="translate(18, 140)">
    <rect x="0" y="0" width="624" height="38" rx="10" fill="#1A202C" stroke="#334155" stroke-width="1"/>
    <text x="14" y="24" class="font-sans" font-size="12" font-weight="600" fill="#F1F5F9">Level 2 · Card Surface</text>
    <text x="175" y="24" class="font-mono" font-size="11" fill="#93A8C7">#1A202C</text>
    <text x="255" y="24" class="font-sans" font-size="11" fill="#94A3B8">World clock, alarm, timer &amp; weather cards</text>
    <text x="610" y="24" text-anchor="end" class="font-mono" font-size="10" fill="#64748B">Tonal step + 0.5dp #334155</text>
  </g>
  <g transform="translate(18, 186)">
