    <text x="16" y="154" class="font-mono" font-size="11" fill="#93A8C7">radius: 12dp</text>
    <text x="16" y="170" class="font-sans" font-size="11" fill="#94A3B8">80 × 64dp fixed photographic tile</text>
  </g>
  <g transform="translate(680, 34)">
