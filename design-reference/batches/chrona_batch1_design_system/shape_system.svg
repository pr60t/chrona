    <text x="14" y="24" class="font-sans" font-size="12" font-weight="600" fill="#F1F5F9">Level 3 · Elevated</text>
    <text x="175" y="24" class="font-mono" font-size="11" fill="#93A8C7">#222A38</text>
    <text x="255" y="24" class="font-sans" font-size="11" fill="#94A3B8">Overflow menus, active cards &amp; search bars</text>
    <text x="610" y="24" text-anchor="end" class="font-mono" font-size="10" fill="#64748B">Tonal step + 1dp #334155</text>
  </g>
  <g transform="translate(18, 232)">
    <rect x="0" y="0" width="624" height="38" rx="10" fill="#2B3547" stroke="#334155" stroke-width="1"/>
    <text x="14" y="24" class="font-sans" font-size="12" font-weight="600" fill="#F1F5F9">Level 4 · Modal / Sheet</text>
    <text x="175" y="24" class="font-mono" font-size="11" fill="#93A8C7">#2B3547</text>
