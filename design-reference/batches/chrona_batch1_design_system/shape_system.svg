    <rect x="154" y="18" width="16" height="96" rx="2" fill="#A7E8D8" stroke="#93A8C7" stroke-width="1.2"/>
    <text x="16" y="136" class="font-sans" font-size="14" font-weight="600" fill="#F1F5F9">Timezone Strip</text>
    <text x="16" y="154" class="font-mono" font-size="11" fill="#93A8C7">radius: 2dp</text>
    <text x="16" y="170" class="font-sans" font-size="11" fill="#94A3B8">4 × 64dp vertical pastel bar</text>
  </g>
  <g transform="translate(1020, 34)">
    <rect x="0" y="0" width="324" height="180" rx="18" fill="#11161F" stroke="#1E293B"/>
    <rect x="52" y="40" width="220" height="52" rx="26" fill="#93A8C7" stroke="#93A8C7" stroke-width="1.2"/>
    <text x="16" y="136" class="font-sans" font-size="14" font-weight="600" fill="#F1F5F9">Primary Pill CTA</text>
