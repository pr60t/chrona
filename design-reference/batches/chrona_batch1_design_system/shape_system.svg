  </g>
  <g transform="translate(1020, 230)">
    <rect x="0" y="0" width="324" height="180" rx="18" fill="#11161F" stroke="#1E293B"/>
    <rect x="130" y="34" width="64" height="64" rx="32" fill="#222A38" stroke="#93A8C7" stroke-width="1.2"/>
