    <text x="16" y="170" class="font-sans" font-size="11" fill="#94A3B8">28dp top corners / all corners</text>
  </g>
  <g transform="translate(680, 230)">
    <rect x="0" y="0" width="324" height="180" rx="18" fill="#11161F" stroke="#1E293B"/>
    <rect x="52" y="40" width="220" height="52" rx="26" fill="#222A38" stroke="#93A8C7" stroke-width="1.2"/>
    <text x="16" y="136" class="font-sans" font-size="14" font-weight="600" fill="#F1F5F9">Search Field</text>
    <text x="16" y="154" class="font-mono" font-size="11" fill="#93A8C7">radius: 28dp</text>
