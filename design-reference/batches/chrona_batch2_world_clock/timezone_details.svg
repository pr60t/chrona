<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 412 915" width="412" height="915">
  <title>CHRONA — City Detail Bottom Sheet (Warsaw)</title>
  <desc>Expanded city detail sheet showing live local clock, UTC offset, device-local time comparison, secondary weather, and sunrise/sunset.</desc>
  <defs>
    <style>
      .font-sans { font-family: Google Sans, Roboto, -apple-system, BlinkMacSystemFont, sans-serif; }
      .font-mono { font-family: Roboto Mono, monospace; }
      .tnum { font-variant-numeric: tabular-nums; }
    </style>
    <linearGradient id="sky-warsaw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3E4C63"/><stop offset="55%" stop-color="#8C7A7B"/><stop offset="100%" stop-color="#D4A68A"/>
    </linearGradient>
    <linearGradient id="sky-london" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5D7491"/><stop offset="60%" stop-color="#9EB1C7"/><stop offset="100%" stop-color="#C9D4E0"/>
    </linearGradient>
    <linearGradient id="sky-boston" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A4961"/><stop offset="60%" stop-color="#7D6B7D"/><stop offset="100%" stop-color="#C98A7A"/>
    </linearGradient>
    <linearGradient id="sky-perth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A5D75"/><stop offset="55%" stop-color="#939BA8"/><stop offset="100%" stop-color="#D8C2B0"/>
    </linearGradient>
    <linearGradient id="sky-kathmandu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2D4363"/><stop offset="55%" stop-color="#758BA8"/><stop offset="100%" stop-color="#E5C896"/>
    </linearGradient>
    <clipPath id="clip-city-80x64">
      <rect x="0" y="0" width="80" height="64" rx="12" ry="12"/>
    </clipPath>
    <clipPath id="clip-city-72x56">
      <rect x="0" y="0" width="72" height="56" rx="12" ry="12"/>
    </clipPath>
    <clipPath id="clip-screen-412x915">
      <rect x="0" y="0" width="412" height="915" rx="36" ry="36"/>
    </clipPath>
  </defs>
  <g id="layer-amoled-canvas" clip-path="url(#clip-screen-412x915)">
    <rect x="0" y="0" width="412" height="915" fill="#000000"/>
  <g id="layer-status-bar">
    <text x="24" y="26" class="font-sans tnum" font-size="13" font-weight="600" fill="#F1F5F9">13:17</text>
    <text x="206" y="26" text-anchor="middle" class="font-mono" font-size="9" fill="#64748B">ILLUSTRATIVE SAMPLE · NOV 19, 2026</text>
    <path d="M352 25 l4 -4 l4 4 M350 22 a8 8 0 0 1 12 0" fill="none" stroke="#F1F5F9" stroke-width="1.4" stroke-linecap="round"/>
    <rect x="370" y="17" width="18" height="10" rx="2.5" fill="none" stroke="#F1F5F9" stroke-width="1.3"/>
    <rect x="372" y="19" width="13" height="6" rx="1" fill="#F1F5F9"/>
  </g>
  <g id="layer-top-app-bar">
    
    <text x="20" y="72" class="font-sans" font-size="22" font-weight="500" fill="#F1F5F9">World Clock</text>
    <g transform="translate(368,54) scale(1.000)" fill="none" stroke="#F1F5F9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="19" r="1.5" fill="currentColor" stroke="none"/></g>
  </g>
  <g id="layer-world-map" transform="translate(16, 90)">
    <g id="map-graticule" transform="scale(1, 0.820)" opacity="0.55">
      <line x1="12" y1="38" x2="368" y2="38" stroke="#1E293B" stroke-width="0.9" stroke-dasharray="2 4"/>
      <line x1="12" y1="76" x2="368" y2="76" stroke="#1E293B" stroke-width="0.9" stroke-dasharray="2 4"/>
      <line x1="12" y1="114" x2="368" y2="114" stroke="#1E293B" stroke-width="0.9" stroke-dasharray="4 3"/>
      <line x1="12" y1="152" x2="368" y2="152" stroke="#1E293B" stroke-width="0.9" stroke-dasharray="2 4"/>
      <line x1="12" y1="184" x2="368" y2="184" stroke="#1E293B" stroke-width="0.9" stroke-dasharray="2 4"/>
      <line x1="64" y1="12" x2="64" y2="196" stroke="#1E293B" stroke-width="0.9" stroke-dasharray="2 4"/>
      <line x1="128" y1="12" x2="128" y2="196" stroke="#1E293B" stroke-width="0.9" stroke-dasharray="2 4"/>
      <line x1="190" y1="12" x2="190" y2="196" stroke="#1E293B" stroke-width="0.9" stroke-dasharray="2 4"/>
      <line x1="252" y1="12" x2="252" y2="196" stroke="#1E293B" stroke-width="0.9" stroke-dasharray="2 4"/>
      <line x1="314" y1="12" x2="314" y2="196" stroke="#1E293B" stroke-width="0.9" stroke-dasharray="2 4"/>
    </g>
    <g id="map-continents" transform="scale(1, 0.820)" fill="#242C3A" stroke="#323D50" stroke-width="0.8" stroke-linejoin="round">
      <!-- North America -->
      <path d="M26,34 L62,24 L108,28 L126,48 L114,72 L96,86 L82,102 L68,96 L56,74 L36,56 Z"/>
      <!-- Greenland -->
      <path d="M124,16 L154,14 L158,32 L136,38 L122,28 Z"/>
      <!-- South America -->
      <path d="M98,108 L124,116 L136,144 L118,184 L104,188 L96,154 L90,126 Z"/>
      <!-- Europe -->
      <path d="M168,36 L204,28 L226,40 L220,64 L196,70 L172,66 L166,50 Z"/>
      <!-- Africa -->
      <path d="M168,76 L208,76 L226,104 L214,154 L194,168 L180,142 L166,108 Z"/>
      <!-- Asia -->
      <path d="M224,32 L308,28 L348,48 L340,84 L302,104 L274,108 L252,96 L228,74 Z"/>
      <!-- Southeast Asia Islands -->
      <path d="M286,114 L308,116 L312,126 L288,124 Z"/>
      <!-- Australia -->
      <path d="M294,136 L336,134 L344,162 L316,172 L292,160 Z"/>
