        <circle cx="176" cy="49.2" r="3.4" fill="#B8C7F2" stroke="#000000" stroke-width="1.2"/>
      </g>
      <g id="marker-boston">
        <circle cx="106" cy="60.7" r="9.0" fill="#F4C2A1" fill-opacity="0.18"/>
        <circle cx="106" cy="60.7" r="3.4" fill="#F4C2A1" stroke="#000000" stroke-width="1.2"/>
      </g>
      <g id="marker-perth">
        <circle cx="306" cy="124.6" r="9.0" fill="#D4B8F0" fill-opacity="0.18"/>
        <circle cx="306" cy="124.6" r="3.4" fill="#D4B8F0" stroke="#000000" stroke-width="1.2"/>
      </g>
      <g id="marker-kathmandu">
        <circle cx="272" cy="75.4" r="9.0" fill="#F2DF9B" fill-opacity="0.18"/>
        <circle cx="272" cy="75.4" r="3.4" fill="#F2DF9B" stroke="#000000" stroke-width="1.2"/>
      </g>
    </g>
  </g>
  <rect x="0" y="0" width="412" height="915" fill="#000000" fill-opacity="0.68"/>
  <g id="layer-city-detail-sheet" transform="translate(0, 152)">
    <rect x="0" y="0" width="412" height="763" rx="28" fill="#2B3547" stroke="#334155" stroke-width="1"/>
    <!-- Drag Handle -->
    <rect x="186" y="12" width="40" height="4" rx="2" fill="#64748B"/>
    <!-- Header Banner with Replaceable City Image + Identity Strip -->
    <g transform="translate(20, 32)">
      <g id="tile-warsaw" transform="translate(0,0)">
      <rect x="0" y="0" width="80" height="64" rx="12" fill="url(#sky-warsaw)"/>
      <g clip-path="url(#clip-city-80x64)"><g transform="scale(1.000,1.000)"><rect x="0" y="42" width="80" height="22" fill="#2A2630"/><rect x="10" y="28" width="12" height="36" fill="#36303D"/><rect x="33" y="14" width="14" height="50" fill="#241F29"/><polygon points="37,14 40,4 43,14" fill="#241F29"/><rect x="52" y="24" width="16" height="40" fill="#312B38"/></g></g>
    </g>
      <rect x="88" y="0" width="4" height="64" rx="2" fill="#A7E8D8"/>
      <text x="104" y="24" class="font-sans" font-size="22" font-weight="600" fill="#F1F5F9">Warsaw</text>
      <text x="104" y="44" class="font-sans" font-size="13" fill="#94A3B8">Poland · UTC +1</text>
      <text x="104" y="61" class="font-mono" font-size="11" fill="#A7E8D8">Europe/Warsaw</text>
      <rect x="332" y="8" width="40" height="40" rx="20" fill="#1A202C"/>
      <g transform="translate(342,18) scale(0.833)" fill="none" stroke="#F1F5F9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></g>
    </g>

    <!-- Primary Live Clock Hero Block -->
    <g transform="translate(20, 114)">
      <rect x="0" y="0" width="372" height="148" rx="20" fill="#1A202C" stroke="#1E293B"/>
      <rect x="16" y="16" width="124" height="24" rx="12" fill="#2A384D"/>
      <g transform="translate(24,21) scale(0.583)" fill="none" stroke="#A7E8D8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></g>
      <text x="44" y="32" class="font-sans" font-size="11" font-weight="600" fill="#DCE6F7">Day · Morning</text>
      <text x="356" y="32" text-anchor="end" class="font-mono" font-size="10" fill="#64748B">ILLUSTRATIVE</text>

      <text x="18" y="102" class="font-sans tnum" font-size="56" font-weight="400" fill="#F1F5F9">08:32</text>
      <text x="18" y="128" class="font-sans" font-size="14" font-weight="500" fill="#94A3B8">Thursday, November 19, 2026</text>

      <!-- Ahead / Behind Badge -->
      <rect x="218" y="68" width="138" height="58" rx="14" fill="#222A38"/>
      <text x="287" y="90" text-anchor="middle" class="font-mono tnum" font-size="15" font-weight="600" fill="#A7E8D8">-4h 45m</text>
      <text x="287" y="110" text-anchor="middle" class="font-sans" font-size="11" fill="#94A3B8">4h 45m behind</text>
    </g>

    <!-- Device-Local Comparison Card -->
    <g transform="translate(20, 276)">
      <rect x="0" y="0" width="372" height="84" rx="20" fill="#1A202C" stroke="#1E293B"/>
      <rect x="14" y="16" width="4" height="52" rx="2" fill="#F2DF9B"/>
      <text x="28" y="34" class="font-mono" font-size="10.5" fill="#94A3B8">DEVICE LOCAL · KATHMANDU (UTC +5:45)</text>
      <text x="28" y="58" class="font-sans" font-size="15" font-weight="600" fill="#F1F5F9">Thu, Nov 19 · Local Reference</text>
      <text x="354" y="52" text-anchor="end" class="font-sans tnum" font-size="24" font-weight="500" fill="#F1F5F9">13:17</text>
    </g>

    <!-- Secondary Weather &amp; Daylight Card (Visually Secondary to Clock) -->
    <g transform="translate(20, 374)">
      <rect x="0" y="0" width="372" height="128" rx="20" fill="#1A202C" stroke="#1E293B"/>
      <rect x="16" y="16" width="44" height="44" rx="14" fill="#222A38"/>
      <g transform="translate(26,26) scale(1.000)" fill="none" stroke="#93A8C7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v2M5.6 5.6l1.4 1.4M3 12h2M17.5 19H9a4 4 0 1 1 .8-7.9A5 5 0 0 1 19.5 13a3.5 3.5 0 0 1-2 6z"/></g>
      <text x="72" y="34" class="font-sans" font-size="15" font-weight="600" fill="#F1F5F9">Partly Cloudy</text>
      <text x="72" y="53" class="font-sans" font-size="12" fill="#94A3B8">Feels like 4° · Wind 11 km/h</text>
      <text x="354" y="46" text-anchor="end" class="font-sans tnum" font-size="26" font-weight="500" fill="#F1F5F9">6°</text>

      <line x1="16" y1="74" x2="356" y2="74" stroke="#1E293B"/>
      <g transform="translate(18,88) scale(0.750)" fill="none" stroke="#93A8C7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v6M8 7l4-4 4 4M4.9 13.9l1.4 1.4M19.1 13.9l-1.4 1.4M3 18h18M8 18a4 4 0 0 1 8 0"/></g>
      <text x="44" y="102" class="font-sans tnum" font-size="12" fill="#94A3B8">Sunrise <tspan fill="#F1F5F9" font-weight="600">07:03</tspan></text>
      <g transform="translate(204,88) scale(0.750)" fill="none" stroke="#93A8C7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9V3M8 7l4 4 4-4M4.9 13.9l1.4 1.4M19.1 13.9l-1.4 1.4M3 18h18M8 18a4 4 0 0 1 8 0"/></g>
      <text x="230" y="102" class="font-sans tnum" font-size="12" fill="#94A3B8">Sunset <tspan fill="#F1F5F9" font-weight="600">15:38</tspan></text>
    </g>

    <!-- Action Buttons inside Bottom Sheet -->
    <g transform="translate(20, 522)">
      <rect x="0" y="0" width="372" height="52" rx="26" fill="#93A8C7"/>
      <g transform="translate(94,15) scale(0.917)" fill="none" stroke="#0B1320" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 1.5M5 3L2 6M22 6l-3-3M6.5 19.5L5 21M17.5 19.5L19 21"/></g>
      <text x="206" y="31" text-anchor="middle" class="font-sans" font-size="15" font-weight="600" fill="#0B1320">Set alarm in Warsaw time</text>

      <rect x="0" y="66" width="372" height="48" rx="24" fill="#1A202C" stroke="#334155"/>
      <text x="186" y="95" text-anchor="middle" class="font-sans" font-size="14" font-weight="500" fill="#F1F5F9">Pin as primary map focus</text>
    </g>
  </g>
  </g>
</svg>