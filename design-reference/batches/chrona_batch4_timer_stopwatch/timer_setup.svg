<g transform="translate(128, 0)"><rect x="0" y="0" width="116" height="66" rx="20" fill="#1A202C" stroke="#1E293B"/><text x="58" y="42" text-anchor="middle" class="font-sans tnum" font-size="24" font-weight="500" fill="#F1F5F9">2</text></g>
<g transform="translate(256, 0)"><rect x="0" y="0" width="116" height="66" rx="20" fill="#1A202C" stroke="#1E293B"/><text x="58" y="42" text-anchor="middle" class="font-sans tnum" font-size="24" font-weight="500" fill="#F1F5F9">3</text></g>
<g transform="translate(0, 78)"><rect x="0" y="0" width="116" height="66" rx="20" fill="#1A202C" stroke="#1E293B"/><text x="58" y="42" text-anchor="middle" class="font-sans tnum" font-size="24" font-weight="500" fill="#F1F5F9">4</text></g>
<g transform="translate(128, 78)"><rect x="0" y="0" width="116" height="66" rx="20" fill="#1A202C" stroke="#1E293B"/><text x="58" y="42" text-anchor="middle" class="font-sans tnum" font-size="24" font-weight="500" fill="#F1F5F9">5</text></g>
<g transform="translate(256, 78)"><rect x="0" y="0" width="116" height="66" rx="20" fill="#1A202C" stroke="#1E293B"/><text x="58" y="42" text-anchor="middle" class="font-sans tnum" font-size="24" font-weight="500" fill="#F1F5F9">6</text></g>
<g transform="translate(0, 156)"><rect x="0" y="0" width="116" height="66" rx="20" fill="#1A202C" stroke="#1E293B"/><text x="58" y="42" text-anchor="middle" class="font-sans tnum" font-size="24" font-weight="500" fill="#F1F5F9">7</text></g>
<g transform="translate(128, 156)"><rect x="0" y="0" width="116" height="66" rx="20" fill="#1A202C" stroke="#1E293B"/><text x="58" y="42" text-anchor="middle" class="font-sans tnum" font-size="24" font-weight="500" fill="#F1F5F9">8</text></g>
<g transform="translate(256, 156)"><rect x="0" y="0" width="116" height="66" rx="20" fill="#1A202C" stroke="#1E293B"/><text x="58" y="42" text-anchor="middle" class="font-sans tnum" font-size="24" font-weight="500" fill="#F1F5F9">9</text></g>
<g transform="translate(0, 234)"><rect x="0" y="0" width="116" height="66" rx="20" fill="#1A202C" stroke="#1E293B"/><text x="58" y="42" text-anchor="middle" class="font-sans tnum" font-size="24" font-weight="500" fill="#F1F5F9">00</text></g>
<g transform="translate(128, 234)"><rect x="0" y="0" width="116" height="66" rx="20" fill="#1A202C" stroke="#1E293B"/><text x="58" y="42" text-anchor="middle" class="font-sans tnum" font-size="24" font-weight="500" fill="#F1F5F9">0</text></g>
<g transform="translate(256, 234)"><rect x="0" y="0" width="116" height="66" rx="20" fill="#222A38" stroke="#1E293B"/><g transform="translate(47,22) scale(0.917)" fill="none" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 6H9l-6 6 6 6h12a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2z"/><line x1="18" y1="10" x2="14" y2="14"/><line x1="14" y1="10" x2="18" y2="14"/></g></g>
  </g>
  <g id="timer-setup-start-cta" transform="translate(20, 766)">
    <rect x="0" y="0" width="372" height="52" rx="26" fill="#93A8C7"/>
    <g transform="translate(116,16) scale(0.833)" fill="none" stroke="#0B1320" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="7 5 19 12 7 19 7 5" fill="currentColor"/></g>
