<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 412 915" width="412" height="915">
  <title>CHRONA — Active Countdown Timer</title>
  <desc>Large circular progress ring with dominant remaining time display and non-competing Pause, Resume, Stop, and Reset controls.</desc>
  <defs>
    <style>
      .font-sans { font-family: Google Sans, Roboto, -apple-system, BlinkMacSystemFont, sans-serif; }
      .font-mono { font-family: Roboto Mono, monospace; }
      .tnum { font-variant-numeric: tabular-nums; }
    </style>
    <radialGradient id="timer-done-glow" cx="50%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#93A8C7" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#A7E8D8" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip-screen-412x915">
      <rect x="0" y="0" width="412" height="915" rx="36" ry="36"/>
    </clipPath>
  </defs>
  <g id="layer-amoled-canvas" clip-path="url(#clip-screen-412x915)">
    <rect x="0" y="0" width="412" height="915" fill="#000000"/>
  <g id="layer-status-bar">
    <text x="24" y="26" class="font-sans tnum" font-size="13" font-weight="600" fill="#F1F5F9">13:25</text>
    <text x="206" y="26" text-anchor="middle" class="font-mono" font-size="9" fill="#64748B">KATHMANDU · UTC +5:45</text>
    <path d="M352 25 l4 -4 l4 4 M350 22 a8 8 0 0 1 12 0" fill="none" stroke="#F1F5F9" stroke-width="1.4" stroke-linecap="round"/>
    <rect x="370" y="17" width="18" height="10" rx="2.5" fill="none" stroke="#F1F5F9" stroke-width="1.3"/>
    <rect x="372" y="19" width="13" height="6" rx="1" fill="#F1F5F9"/>
  </g>
  <g id="layer-top-app-bar">
    
    <text x="20" y="72" class="font-sans" font-size="22" font-weight="500" fill="#F1F5F9">Timer</text>
    <g transform="translate(368,54) scale(1.000)" fill="none" stroke="#F1F5F9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="19" r="1.5" fill="currentColor" stroke="none"/></g>
  </g>
  <!-- Timer Label Pill -->
  <g transform="translate(116, 94)">
    <rect x="0" y="0" width="180" height="32" rx="16" fill="#1A202C" stroke="#1E293B"/>
    <circle cx="18" cy="16" r="4.5" fill="#93A8C7"/>
    <text x="100" y="21" text-anchor="middle" class="font-sans" font-size="13" font-weight="600" fill="#F1F5F9">Pour-Over Coffee</text>
  </g>

  <!-- Large Circular Countdown Visualization (Dominant Hierarchy) -->
  <g id="active-timer-ring" transform="translate(0, 134)">
    <circle cx="206" cy="168" r="144" fill="#080B10"/>
    <g id="circular-progress-ring">
      <circle cx="206" cy="168" r="140" fill="none" stroke="#222A38" stroke-width="10"/>
      <circle cx="206" cy="168" r="140" fill="none" stroke="#93A8C7" stroke-width="10"
              stroke-dasharray="598.16 879.65" stroke-linecap="round"
              transform="rotate(-90 206 168)"/>
      <circle cx="79.3" cy="227.6" r="7.5" fill="#93A8C7"/>
    </g>
    <text x="206" y="114" text-anchor="middle" class="font-mono" font-size="11" font-weight="600" letter-spacing="1" fill="#93A8C7">REMAINING</text>
    <text x="206" y="182" text-anchor="middle" class="font-sans tnum" font-size="58" font-weight="400" letter-spacing="-1" fill="#F1F5F9">08:30</text>
    <text x="206" y="214" text-anchor="middle" class="font-mono tnum" font-size="12" fill="#94A3B8">Total 12:30 · Ends 13:33</text>
    <!-- Quick +1:00 Extend Chip -->
    <rect x="162" y="232" width="88" height="30" rx="15" fill="#222A38" stroke="#334155"/>
    <text x="206" y="252" text-anchor="middle" class="font-mono tnum" font-size="12" font-weight="600" fill="#93A8C7">+1:00</text>
  </g>

  <!-- Restrained Primary Controls: Reset | Pause (Primary) | Stop -->
  <g id="active-timer-primary-controls" transform="translate(20, 514)">
    <!-- Reset -->
    <g transform="translate(18, 10)">
      <circle cx="34" cy="34" r="34" fill="#1A202C" stroke="#334155"/>
      <g transform="translate(22,22) scale(1.000)" fill="none" stroke="#F1F5F9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36L21 8M21 3v5h-5"/></g>
      <text x="34" y="86" text-anchor="middle" class="font-sans" font-size="12" font-weight="500" fill="#94A3B8">Reset</text>
    </g>

    <!-- Pause (Primary Pill Center) -->
    <g transform="translate(114, 4)">
      <rect x="0" y="0" width="144" height="76" rx="38" fill="#93A8C7"/>
      <g transform="translate(32,26) scale(1.000)" fill="none" stroke="#0B1320" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"/></g>
      <text x="92" y="44" text-anchor="middle" class="font-sans" font-size="16" font-weight="700" fill="#0B1320">Pause</text>
    </g>

    <!-- Stop -->
    <g transform="translate(286, 10)">
      <circle cx="34" cy="34" r="34" fill="#1A202C" stroke="#334155"/>
      <g transform="translate(22,22) scale(1.000)" fill="none" stroke="#FCA5A5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></g>
      <text x="34" y="86" text-anchor="middle" class="font-sans" font-size="12" font-weight="500" fill="#94A3B8">Stop</text>
    </g>
  </g>

  <!-- Paused / Resume Secondary State Strip -->
  <g id="paused-resume-preview-strip" transform="translate(20, 646)">
    <rect x="0" y="0" width="372" height="58" rx="18" fill="#1A202C" stroke="#1E293B"/>
    <text x="18" y="25" class="font-mono" font-size="10.5" fill="#94A3B8">WHEN PAUSED · RESUME ACTION</text>
    <text x="18" y="44" class="font-sans" font-size="12.5" fill="#F1F5F9">Tap Resume to continue countdown</text>
    <rect x="264" y="11" width="92" height="36" rx="18" fill="#2A384D" stroke="#93A8C7"/>
    <g transform="translate(276,20) scale(0.667)" fill="none" stroke="#DCE6F7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="7 5 19 12 7 19 7 5" fill="currentColor"/></g>
    <text x="322" y="34" text-anchor="middle" class="font-sans" font-size="12.5" font-weight="600" fill="#DCE6F7">Resume</text>
  </g>
  <g id="layer-bottom-navigation" transform="translate(0, 835)">
    <rect x="0" y="0" width="412" height="80" fill="#11161F"/>
    <line x1="0" y1="0" x2="412" y2="0" stroke="#1E293B" stroke-width="1"/>
    <g id="nav-dest-1-alarms">
      
      <g transform="translate(29.200000000000003,14) scale(1.000)" fill="none" stroke="#94A3B8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 1.5M5 3L2 6M22 6l-3-3M6.5 19.5L5 21M17.5 19.5L19 21"/></g>
      <text x="41.2" y="59" text-anchor="middle" class="font-sans" font-size="11" font-weight="500" fill="#94A3B8">Alarms</text>
    </g>
    <g id="nav-dest-2-world-clock">
      
      <g transform="translate(111.60000000000001,14) scale(1.000)" fill="none" stroke="#94A3B8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3.6 9h16.8M3.6 15h16.8M11.5 3a17 17 0 0 0 0 18M12.5 3a17 17 0 0 1 0 18"/></g>
      <text x="123.6" y="59" text-anchor="middle" class="font-sans" font-size="11" font-weight="500" fill="#94A3B8">World Clock</text>
    </g>
    <g id="nav-dest-3-timer">
      <rect x="178.0" y="10" width="56" height="32" rx="16" fill="#2A384D"/>
      <g transform="translate(194.0,14) scale(1.000)" fill="none" stroke="#DCE6F7" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12M6 21h12M7 3v3.5a5 5 0 0 0 2.2 4.1L12 12.5l2.8-1.9A5 5 0 0 0 17 6.5V3M7 21v-3.5a5 5 0 0 1 2.2-4.1L12 11.5l2.8 1.9a5 5 0 0 1 2.2 4.1V21"/></g>
      <text x="206.0" y="59" text-anchor="middle" class="font-sans" font-size="11" font-weight="600" fill="#F1F5F9">Timer</text>
    </g>
    <g id="nav-dest-4-stopwatch">
      
      <g transform="translate(276.40000000000003,14) scale(1.000)" fill="none" stroke="#94A3B8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M10 2h4M12 9v4M18 6l1.5-1.5"/></g>
      <text x="288.4" y="59" text-anchor="middle" class="font-sans" font-size="11" font-weight="500" fill="#94A3B8">Stopwatch</text>
    </g>
    <g id="nav-dest-5-bedtime">
      
      <g transform="translate(358.8,14) scale(1.000)" fill="none" stroke="#94A3B8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M19.5 14.5A7.5 7.5 0 0 1 9.5 4.5a7.5 7.5 0 1 0 10 10z"/></g>
      <text x="370.8" y="59" text-anchor="middle" class="font-sans" font-size="11" font-weight="500" fill="#94A3B8">Bedtime</text>
    </g>
  </g>
  </g>
</svg>