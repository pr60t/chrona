<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 412 915" width="412" height="915">
  <title>CHRONA — Full-Screen Timer Completion</title>
  <desc>Immersive AMOLED timer finished screen with timer name, zeroed readout, Repeat, and Dismiss controls.</desc>
  <defs>
    <style>
      .font-sans { font-family: Google Sans, Roboto, -apple-system, BlinkMacSystemFont, sans-serif; }
      .font-mono { font-family: Roboto Mono, monospace; }
      .tnum { font-variant-numeric: tabular-nums; }
    </style>
    <radialGradient id="timer-done-glow" cx="50%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#93A8C7" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#A7E8D8" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip-screen-412x915">
      <rect x="0" y="0" width="412" height="915" rx="36" ry="36"/>
    </clipPath>
  </defs>
  <g id="layer-amoled-canvas" clip-path="url(#clip-screen-412x915)">
    <rect x="0" y="0" width="412" height="915" fill="#000000"/>
  <rect x="0" y="0" width="412" height="915" fill="url(#timer-done-glow)"/>
  <circle cx="206" cy="316" r="154" fill="none" stroke="#93A8C7" stroke-opacity="0.22" stroke-width="1.5"/>
  <circle cx="206" cy="316" r="126" fill="#080B10" stroke="#93A8C7" stroke-width="4"/>

  <!-- Timer Name Badge -->
  <g transform="translate(106, 86)">
    <rect x="0" y="0" width="200" height="36" rx="18" fill="#1A202C" stroke="#93A8C7"/>
    <text x="100" y="23" text-anchor="middle" class="font-sans" font-size="14" font-weight="600" fill="#F1F5F9">Pour-Over Coffee</text>
  </g>

  <text x="206" y="160" text-anchor="middle" class="font-mono" font-size="12" font-weight="600" letter-spacing="1.2" fill="#6EE7B7">TIME'S UP · FINISHED</text>

  <!-- Zeroed / Overtime Hero Counter -->
  <text x="206" y="328" text-anchor="middle" class="font-sans tnum" font-size="64" font-weight="400" fill="#F1F5F9">00:00</text>
  <text x="206" y="362" text-anchor="middle" class="font-mono tnum" font-size="13" fill="#FCD34D">-00:14 overtime</text>

  <!-- Repeat &amp; Dismiss Controls -->
  <g id="timer-finished-actions" transform="translate(24, 594)">
    <!-- Repeat -->
    <rect x="0" y="0" width="364" height="66" rx="33" fill="#222A38" stroke="#334155" stroke-width="1.2"/>
    <g transform="translate(104,21) scale(1.000)" fill="none" stroke="#93A8C7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36L21 8M21 3v5h-5"/></g>
    <text x="198" y="39" text-anchor="middle" class="font-sans" font-size="17" font-weight="600" fill="#F1F5F9">Repeat (12:30)</text>

    <!-- Dismiss (Primary Unambiguous Pill) -->
    <g transform="translate(0, 90)">
      <rect x="0" y="0" width="364" height="82" rx="41" fill="#93A8C7"/>
      <g transform="translate(116,29) scale(1.000)" fill="none" stroke="#0B1320" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></g>
      <text x="202" y="48" text-anchor="middle" class="font-sans" font-size="20" font-weight="700" fill="#0B1320">Dismiss</text>
    </g>
  </g>
  </g>
</svg>