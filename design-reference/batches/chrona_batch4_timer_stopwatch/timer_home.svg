    <g id="preset-5min" transform="translate(256, 28)">
      <rect x="0" y="0" width="116" height="70" rx="20" fill="#1A202C" stroke="#1E293B"/>
      <text x="58" y="34" text-anchor="middle" class="font-sans tnum" font-size="18" font-weight="600" fill="#F1F5F9">5 min</text>
      <text x="58" y="54" text-anchor="middle" class="font-mono tnum" font-size="10.5" fill="#94A3B8">00:05:00</text>
    </g>
    <g id="preset-10min" transform="translate(0, 110)">
      <rect x="0" y="0" width="116" height="70" rx="20" fill="#1A202C" stroke="#1E293B"/>
      <text x="58" y="34" text-anchor="middle" class="font-sans tnum" font-size="18" font-weight="600" fill="#F1F5F9">10 min</text>
      <text x="58" y="54" text-anchor="middle" class="font-mono tnum" font-size="10.5" fill="#94A3B8">00:10:00</text>
    </g>
    <g id="preset-15min" transform="translate(128, 110)">
      <rect x="0" y="0" width="116" height="70" rx="20" fill="#1A202C" stroke="#1E293B"/>
      <text x="58" y="34" text-anchor="middle" class="font-sans tnum" font-size="18" font-weight="600" fill="#F1F5F9">15 min</text>
      <text x="58" y="54" text-anchor="middle" class="font-mono tnum" font-size="10.5" fill="#94A3B8">00:15:00</text>
    </g>
    <g id="preset-30min" transform="translate(256, 110)">
      <rect x="0" y="0" width="116" height="70" rx="20" fill="#1A202C" stroke="#1E293B"/>
      <text x="58" y="34" text-anchor="middle" class="font-sans tnum" font-size="18" font-weight="600" fill="#F1F5F9">30 min</text>
      <text x="58" y="54" text-anchor="middle" class="font-mono tnum" font-size="10.5" fill="#94A3B8">00:30:00</text>
    </g>
  </g>
  <g id="layer-timer-home-actions" transform="translate(20, 624)">
    <rect x="0" y="0" width="372" height="54" rx="20" fill="#1A202C" stroke="#334155"/>
    <g transform="translate(18,16) scale(0.917)" fill="none" stroke="#93A8C7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12M6 21h12M7 3v3.5a5 5 0 0 0 2.2 4.1L12 12.5l2.8-1.9A5 5 0 0 0 17 6.5V3M7 21v-3.5a5 5 0 0 1 2.2-4.1L12 11.5l2.8 1.9a5 5 0 0 1 2.2 4.1V21"/></g>
    <text x="52" y="32" class="font-sans" font-size="15" font-weight="500" fill="#F1F5F9">Custom timer</text>
    <text x="354" y="32" text-anchor="end" class="font-mono" font-size="12" fill="#93A8C7">HH : MM : SS</text>

    <!-- Primary Add Timer Pill CTA -->
    <g transform="translate(0, 142)">
      <rect x="0" y="0" width="372" height="52" rx="26" fill="#93A8C7"/>
      <g transform="translate(122,15) scale(0.917)" fill="none" stroke="#0B1320" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></g>
      <text x="206" y="31" text-anchor="middle" class="font-sans" font-size="15" font-weight="600" fill="#0B1320">Add timer</text>
    </g>
  </g>
  <g id="layer-bottom-navigation" transform="translate(0, 835)">
    <rect x="0" y="0" width="412" height="80" fill="#11161F"/>
    <line x1="0" y1="0" x2="412" y2="0" stroke="#1E293B" stroke-width="1"/>
    <g id="nav-dest-1-alarms">
      
      <g transform="translate(29.200000000000003,14) scale(1.000)" fill="none" stroke="#94A3B8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 1.5M5 3L2 6M22 6l-3-3M6.5 19.5L5 21M17.5 19.5L19 21"/></g>
      <text x="41.2" y="59" text-anchor="middle" class="font-sans" font-size="11" font-weight="500" fill="#94A3B8">Alarms</text>
    </g>
    <g id="nav-dest-2-world-clock">
      
      <g transform="translate(111.60000000000001,14) scale(1.000)" fill="none" stroke="#94A3B8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3.6 9h16.8M3.6 15h16.8M11.5 3a17 17 0 0 0 0 18M12.5 3a17 17 0 0 1 0 18"/></g>
      <text x="123.6" y="59" text-anchor="middle" class="font-sans" font-size="11" font-weight="500" fill="#94A3B8">World Clock</text>
    </g>
    <g id="nav-dest-3-timer">
      <rect x="178.0" y="10" width="56" height="32" rx="16" fill="#2A384D"/>
      <g transform="translate(194.0,14) scale(1.000)" fill="none" stroke="#DCE6F7" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12M6 21h12M7 3v3.5a5 5 0 0 0 2.2 4.1L12 12.5l2.8-1.9A5 5 0 0 0 17 6.5V3M7 21v-3.5a5 5 0 0 1 2.2-4.1L12 11.5l2.8 1.9a5 5 0 0 1 2.2 4.1V21"/></g>
      <text x="206.0" y="59" text-anchor="middle" class="font-sans" font-size="11" font-weight="600" fill="#F1F5F9">Timer</text>
    </g>
    <g id="nav-dest-4-stopwatch">
      
      <g transform="translate(276.40000000000003,14) scale(1.000)" fill="none" stroke="#94A3B8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M10 2h4M12 9v4M18 6l1.5-1.5"/></g>
      <text x="288.4" y="59" text-anchor="middle" class="font-sans" font-size="11" font-weight="500" fill="#94A3B8">Stopwatch</text>
    </g>
    <g id="nav-dest-5-bedtime">
      
      <g transform="translate(358.8,14) scale(1.000)" fill="none" stroke="#94A3B8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M19.5 14.5A7.5 7.5 0 0 1 9.5 4.5a7.5 7.5 0 1 0 10 10z"/></g>
      <text x="370.8" y="59" text-anchor="middle" class="font-sans" font-size="11" font-weight="500" fill="#94A3B8">Bedtime</text>
