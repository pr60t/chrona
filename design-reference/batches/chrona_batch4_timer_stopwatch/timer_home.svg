<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 412 915" width="412" height="915">
  <title>CHRONA — Timer Home (Empty &amp; Presets)</title>
  <desc>Zeroed circular timer visualization with 1m, 3m, 5m, 10m, 15m, and 30m presets, custom timer option, and Add timer CTA.</desc>
  <defs>
    <style>
      .font-sans { font-family: Google Sans, Roboto, -apple-system, BlinkMacSystemFont, sans-serif; }
      .font-mono { font-family: Roboto Mono, monospace; }
      .tnum { font-variant-numeric: tabular-nums; }
    </style>
    <radialGradient id="timer-done-glow" cx="50%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#93A8C7" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#A7E8D8" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip-screen-412x915">
      <rect x="0" y="0" width="412" height="915" rx="36" ry="36"/>
    </clipPath>
  </defs>
  <g id="layer-amoled-canvas" clip-path="url(#clip-screen-412x915)">
    <rect x="0" y="0" width="412" height="915" fill="#000000"/>
  <g id="layer-status-bar">
    <text x="24" y="26" class="font-sans tnum" font-size="13" font-weight="600" fill="#F1F5F9">13:25</text>
    <text x="206" y="26" text-anchor="middle" class="font-mono" font-size="9" fill="#64748B">KATHMANDU · UTC +5:45</text>
    <path d="M352 25 l4 -4 l4 4 M350 22 a8 8 0 0 1 12 0" fill="none" stroke="#F1F5F9" stroke-width="1.4" stroke-linecap="round"/>
    <rect x="370" y="17" width="18" height="10" rx="2.5" fill="none" stroke="#F1F5F9" stroke-width="1.3"/>
    <rect x="372" y="19" width="13" height="6" rx="1" fill="#F1F5F9"/>
  </g>
  <g id="layer-top-app-bar">
    
    <text x="20" y="72" class="font-sans" font-size="22" font-weight="500" fill="#F1F5F9">Timer</text>
    <g transform="translate(368,54) scale(1.000)" fill="none" stroke="#F1F5F9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="19" r="1.5" fill="currentColor" stroke="none"/></g>
  </g>
  <g id="layer-timer-hero-ring" transform="translate(0, 102)">
    <circle cx="206" cy="146" r="126" fill="#080B10" stroke="#222A38" stroke-width="8"/>
    <circle cx="206" cy="146" r="110" fill="none" stroke="#1E293B" stroke-width="1" stroke-dasharray="3 5"/>
    <text x="206" y="136" text-anchor="middle" class="font-mono" font-size="11" font-weight="600" letter-spacing="1" fill="#94A3B8">READY</text>
    <text x="206" y="176" text-anchor="middle" class="font-sans tnum" font-size="44" font-weight="400" fill="#F1F5F9">00:00:00</text>
    <text x="206" y="202" text-anchor="middle" class="font-sans" font-size="12" fill="#64748B">Select a quick preset or custom duration</text>
  </g>

  <!-- 6 Preset Duration Pills (2 rows x 3 columns, 372dp total width) -->
  <g id="layer-timer-presets" transform="translate(20, 412)">
    <text x="0" y="14" class="font-mono" font-size="11" font-weight="600" fill="#93A8C7">QUICK PRESETS</text>
    <g id="preset-1min" transform="translate(0, 28)">
      <rect x="0" y="0" width="116" height="70" rx="20" fill="#1A202C" stroke="#1E293B"/>
      <text x="58" y="34" text-anchor="middle" class="font-sans tnum" font-size="18" font-weight="600" fill="#F1F5F9">1 min</text>
      <text x="58" y="54" text-anchor="middle" class="font-mono tnum" font-size="10.5" fill="#94A3B8">00:01:00</text>
    </g>
    <g id="preset-3min" transform="translate(128, 28)">
      <rect x="0" y="0" width="116" height="70" rx="20" fill="#1A202C" stroke="#1E293B"/>
      <text x="58" y="34" text-anchor="middle" class="font-sans tnum" font-size="18" font-weight="600" fill="#F1F5F9">3 min</text>
      <text x="58" y="54" text-anchor="middle" class="font-mono tnum" font-size="10.5" fill="#94A3B8">00:03:00</text>
