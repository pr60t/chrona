<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 412 915" width="412" height="915">
  <title>CHRONA — DST Duplicate Local Time Warning</title>
  <desc>Plain-language explanation of fall-back DST overlap offering First occurrence or Second occurrence.</desc>
  <defs>
    <style>
      .font-sans { font-family: Google Sans, Roboto, -apple-system, BlinkMacSystemFont, sans-serif; }
      .font-mono { font-family: Roboto Mono, monospace; }
      .tnum { font-variant-numeric: tabular-nums; }
    </style>
    <radialGradient id="ringing-glow" cx="50%" cy="34%" r="52%">
      <stop offset="0%" stop-color="#A7E8D8" stop-opacity="0.18"/>
      <stop offset="55%" stop-color="#93A8C7" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip-screen-412x915">
      <rect x="0" y="0" width="412" height="915" rx="36" ry="36"/>
    </clipPath>
  </defs>
  <g id="layer-amoled-canvas" clip-path="url(#clip-screen-412x915)">
    <rect x="0" y="0" width="412" height="915" fill="#000000"/>
  <g id="layer-status-bar">
    <text x="24" y="26" class="font-sans tnum" font-size="13" font-weight="600" fill="#F1F5F9">13:17</text>
    <text x="206" y="26" text-anchor="middle" class="font-mono" font-size="9" fill="#64748B">KATHMANDU · UTC +5:45</text>
    <path d="M352 25 l4 -4 l4 4 M350 22 a8 8 0 0 1 12 0" fill="none" stroke="#F1F5F9" stroke-width="1.4" stroke-linecap="round"/>
    <rect x="370" y="17" width="18" height="10" rx="2.5" fill="none" stroke="#F1F5F9" stroke-width="1.3"/>
    <rect x="372" y="19" width="13" height="6" rx="1" fill="#F1F5F9"/>
  </g>
  <g id="layer-top-app-bar">
    <g transform="translate(16,54) scale(1.000)" fill="none" stroke="#F1F5F9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></g>
    <text x="52" y="72" class="font-sans" font-size="22" font-weight="500" fill="#F1F5F9">Daylight saving notice</text>
    <g transform="translate(368,54) scale(1.000)" fill="none" stroke="#F1F5F9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="19" r="1.5" fill="currentColor" stroke="none"/></g>
  </g>
  <g id="dst-overlap-card" transform="translate(20, 102)">
    <rect x="0" y="0" width="372" height="632" rx="24" fill="#2B3547" stroke="#93A8C7" stroke-width="1.3"/>
    <rect x="20" y="24" width="4" height="42" rx="2" fill="#A7E8D8"/>
    <text x="34" y="42" class="font-sans" font-size="16" font-weight="600" fill="#F1F5F9">Warsaw, Poland</text>
    <text x="34" y="60" class="font-mono" font-size="11" fill="#A7E8D8">Europe/Warsaw · Fall Back</text>

    <g transform="translate(20, 88)">
      <rect x="0" y="0" width="332" height="148" rx="18" fill="#1A202C" stroke="#1E293B"/>
      <circle cx="34" cy="36" r="18" fill="#2A384D"/>
      <g transform="translate(24,26) scale(0.833)" fill="none" stroke="#DCE6F7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></g>
      <text x="64" y="34" class="font-sans" font-size="16" font-weight="600" fill="#F1F5F9">02:15 happens twice on Oct 25</text>
      <text x="64" y="52" class="font-mono" font-size="11" fill="#93A8C7">AUTUMN DST CLOCK REPEAT</text>
      <text x="18" y="84" class="font-sans" font-size="13" fill="#94A3B8">When clocks fall back from 03:00 to 02:00,</text>
      <text x="18" y="104" class="font-sans" font-size="13" fill="#94A3B8">02:15 occurs once in summer time (CEST)</text>
      <text x="18" y="124" class="font-sans" font-size="13" fill="#94A3B8">and again one hour later in winter time (CET).</text>
    </g>

    <!-- Option 1: First Occurrence (Selected) -->
    <g transform="translate(20, 254)">
      <rect x="0" y="0" width="332" height="114" rx="18" fill="#2A384D" stroke="#93A8C7" stroke-width="1.5"/>
      <circle cx="24" cy="28" r="9" fill="none" stroke="#93A8C7" stroke-width="2"/>
      <circle cx="24" cy="28" r="4.5" fill="#93A8C7"/>
      <text x="44" y="33" class="font-sans" font-size="15" font-weight="600" fill="#F1F5F9">First occurrence (earlier)</text>
      <text x="44" y="56" class="font-sans tnum" font-size="20" font-weight="600" fill="#DCE6F7">02:15 CEST <tspan font-size="12.5" font-weight="400" fill="#94A3B8">→ 06:00 Kathmandu</tspan></text>
      <text x="44" y="80" class="font-sans" font-size="12" fill="#DCE6F7">Rings the first time 02:15 arrives.</text>
    </g>

    <!-- Option 2: Second Occurrence -->
    <g transform="translate(20, 384)">
      <rect x="0" y="0" width="332" height="114" rx="18" fill="#1A202C" stroke="#1E293B"/>
      <circle cx="24" cy="28" r="9" fill="none" stroke="#94A3B8" stroke-width="2"/>
      <text x="44" y="33" class="font-sans" font-size="15" font-weight="600" fill="#F1F5F9">Second occurrence (1 hr later)</text>
      <text x="44" y="56" class="font-sans tnum" font-size="20" font-weight="600" fill="#F1F5F9">02:15 CET <tspan font-size="12.5" font-weight="400" fill="#94A3B8">→ 07:00 Kathmandu</tspan></text>
      <text x="44" y="80" class="font-sans" font-size="12" fill="#94A3B8">Rings after clocks have fallen back.</text>
    </g>

    <rect x="20" y="544" width="332" height="52" rx="26" fill="#93A8C7"/>
    <text x="186" y="575" text-anchor="middle" class="font-sans" font-size="15" font-weight="600" fill="#0B1320">Save occurrence choice</text>
  </g>
  <g id="layer-bottom-navigation" transform="translate(0, 835)">
