<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 412 915" width="412" height="915">
  <title>CHRONA — Create World Alarm</title>
  <desc>Dedicated world alarm creation flow distinguishing destination local time from device-local ring time.</desc>
  <defs>
