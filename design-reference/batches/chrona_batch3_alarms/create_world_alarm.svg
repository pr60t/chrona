    <text x="316" y="37" text-anchor="middle" class="font-sans" font-size="12" font-weight="600" fill="#93A8C7">Change</text>
  </g>
  <g id="world-alarm-dual-comparison" transform="translate(20, 166)">
    <!-- Destination Time Card -->
    <rect x="0" y="0" width="372" height="118" rx="20" fill="#1A202C" stroke="#A7E8D8" stroke-width="1.4"/>
    <text x="18" y="24" class="font-mono" font-size="10.5" font-weight="600" fill="#A7E8D8">DESTINATION TIME · WARSAW (CET)</text>
    <g transform="translate(18, 36)">
      <rect x="0" y="0" width="88" height="64" rx="14" fill="#2A384D" stroke="#93A8C7" stroke-width="1.4"/>
      <text x="44" y="44" text-anchor="middle" class="font-sans tnum" font-size="36" font-weight="500" fill="#DCE6F7">09</text>
