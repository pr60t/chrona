      <text x="28" y="64" class="font-sans tnum" font-size="34" font-weight="600" fill="#F1F5F9">13:45</text>
      <text x="128" y="62" class="font-sans" font-size="12.5" fill="#6EE7B7">Fri, Nov 20 (+4h 45m)</text>
