  <circle cx="310.0" cy="19" r="18" fill="#222A38" stroke="#334155"/>
  <text x="310.0" y="24" text-anchor="middle" class="font-sans" font-size="12" font-weight="600" fill="#94A3B8">S</text>
</g>

    <line x1="18" y1="142" x2="354" y2="142" stroke="#1E293B"/>

