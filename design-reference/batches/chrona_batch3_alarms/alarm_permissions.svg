<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 412 915" width="412" height="915">
  <title>CHRONA — Alarm Permissions &amp; Reboot Restoration</title>
  <desc>Permission unavailable remediation card and post-reboot alarm restoration informational state.</desc>
