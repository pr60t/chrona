  <g id="permission-unavailable-card" transform="translate(20, 96)">
    <rect x="0" y="0" width="372" height="292" rx="22" fill="#1A202C" stroke="#FCA5A5" stroke-width="1.2"/>
    <circle cx="44" cy="44" r="22" fill="#3F1518"/>
    <g transform="translate(33,33) scale(0.917)" fill="none" stroke="#FCA5A5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></g>
    <text x="78" y="40" class="font-sans" font-size="16" font-weight="600" fill="#F1F5F9">Exact alarm permission needed</text>
    <text x="78" y="59" class="font-mono" font-size="10.5" fill="#FCA5A5">SCHEDULE_EXACT_ALARM · DISABLED</text>

    <text x="20" y="96" class="font-sans" font-size="13" fill="#94A3B8">Android restricts exact wake-up triggers when</text>
    <text x="20" y="116" class="font-sans" font-size="13" fill="#94A3B8">"Alarms &amp; reminders" permission is turned off.</text>
    <text x="20" y="136" class="font-sans" font-size="13" fill="#94A3B8">World and local alarms may be delayed by battery</text>
    <text x="20" y="156" class="font-sans" font-size="13" fill="#94A3B8">optimization until enabled in system settings.</text>

    <rect x="20" y="182" width="332" height="48" rx="24" fill="#93A8C7"/>
    <text x="186" y="211" text-anchor="middle" class="font-sans" font-size="14" font-weight="600" fill="#0B1320">Grant exact alarm access</text>

    <rect x="20" y="240" width="332" height="36" rx="18" fill="#222A38"/>
    <text x="186" y="263" text-anchor="middle" class="font-sans" font-size="12.5" font-weight="500" fill="#F1F5F9">Check notification &amp; full-screen alerts</text>
  </g>
  <g id="reboot-restoration-card" transform="translate(20, 408)">
    <rect x="0" y="0" width="372" height="214" rx="22" fill="#1A202C" stroke="#6EE7B7" stroke-width="1.1"/>
    <circle cx="44" cy="44" r="22" fill="#10382C"/>
    <g transform="translate(33,33) scale(0.917)" fill="none" stroke="#6EE7B7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36L21 8M21 3v5h-5"/></g>
    <text x="78" y="40" class="font-sans" font-size="16" font-weight="600" fill="#F1F5F9">Reboot protection active</text>
    <text x="78" y="59" class="font-mono" font-size="10.5" fill="#6EE7B7">LOCKED_BOOT_COMPLETED · VERIFIED</text>

    <text x="20" y="96" class="font-sans" font-size="13" fill="#94A3B8">CHRONA automatically restores all local and</text>
    <text x="20" y="116" class="font-sans" font-size="13" fill="#94A3B8">foreign-timezone alarms immediately after device</text>
    <text x="20" y="136" class="font-sans" font-size="13" fill="#94A3B8">reboot—even before first screen unlock.</text>

    <rect x="20" y="158" width="332" height="38" rx="14" fill="#11161F"/>
    <text x="34" y="182" class="font-mono" font-size="11" fill="#F1F5F9">Last verified: Today, 07:02 · 3 alarms active</text>
  </g>
