<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 412 915" width="412" height="915">
  <title>CHRONA — Full-Screen Immersive Alarm Ringing</title>
  <desc>Full-screen AMOLED alarm ringing interface with ambient glow, dual destination/local clocks, snooze button, and unambiguous dismiss control.</desc>
  <defs>
    <style>
      .font-sans { font-family: Google Sans, Roboto, -apple-system, BlinkMacSystemFont, sans-serif; }
      .font-mono { font-family: Roboto Mono, monospace; }
      .tnum { font-variant-numeric: tabular-nums; }
    </style>
    <radialGradient id="ringing-glow" cx="50%" cy="34%" r="52%">
      <stop offset="0%" stop-color="#A7E8D8" stop-opacity="0.18"/>
      <stop offset="55%" stop-color="#93A8C7" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip-screen-412x915">
      <rect x="0" y="0" width="412" height="915" rx="36" ry="36"/>
    </clipPath>
  </defs>
  <g id="layer-amoled-canvas" clip-path="url(#clip-screen-412x915)">
    <rect x="0" y="0" width="412" height="915" fill="#000000"/>
  <!-- Soft Ambient Glow on Pitch-Black AMOLED -->
  <rect x="0" y="0" width="412" height="915" fill="url(#ringing-glow)"/>
  <circle cx="206" cy="310" r="158" fill="none" stroke="#A7E8D8" stroke-opacity="0.16" stroke-width="1.2"/>
  <circle cx="206" cy="310" r="122" fill="none" stroke="#A7E8D8" stroke-opacity="0.28" stroke-width="1.5"/>

  <!-- Top City &amp; Timezone Pill -->
  <g transform="translate(86, 76)">
    <rect x="0" y="0" width="240" height="36" rx="18" fill="#1A202C" stroke="#A7E8D8" stroke-width="1.2"/>
    <circle cx="20" cy="18" r="5" fill="#A7E8D8"/>
    <text x="128" y="23" text-anchor="middle" class="font-mono" font-size="11.5" font-weight="600" fill="#F1F5F9">WARSAW · EUROPE/WARSAW</text>
  </g>

  <!-- Alarm Label -->
  <text x="206" y="156" text-anchor="middle" class="font-sans" font-size="22" font-weight="600" fill="#F1F5F9">Warsaw Standup</text>
  <text x="206" y="182" text-anchor="middle" class="font-mono" font-size="12" fill="#A7E8D8">DESTINATION ALARM TIME (UTC +1)</text>

  <!-- Massive Hero Destination Digital Clock -->
  <text x="206" y="294" text-anchor="middle" class="font-sans tnum" font-size="88" font-weight="400" letter-spacing="-2" fill="#F1F5F9">09:00</text>
  <text x="206" y="328" text-anchor="middle" class="font-sans" font-size="15" fill="#94A3B8">Friday, November 20, 2026</text>

  <!-- Secondary Device-Local Time Card -->
  <g transform="translate(56, 368)">
    <rect x="0" y="0" width="300" height="68" rx="20" fill="#1A202C" stroke="#1E293B"/>
    <rect x="14" y="14" width="4" height="40" rx="2" fill="#F2DF9B"/>
    <text x="28" y="30" class="font-mono" font-size="10" fill="#94A3B8">DEVICE LOCAL · KATHMANDU</text>
    <text x="28" y="52" class="font-sans tnum" font-size="20" font-weight="500" fill="#F1F5F9">13:45 <tspan font-size="12" fill="#94A3B8">(UTC +5:45)</tspan></text>
  </g>

  <!-- Large Accessible Controls: Snooze (Secondary Tonal) + Unambiguous Dismiss Pill -->
  <g id="ringing-controls" transform="translate(24, 594)">
    <!-- Snooze Pill -->
    <rect x="0" y="0" width="364" height="68" rx="34" fill="#222A38" stroke="#334155" stroke-width="1.2"/>
    <g transform="translate(112,22) scale(1.000)" fill="none" stroke="#93A8C7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 8h6l-6 8h6M15 4h4l-4 5h4"/></g>
    <text x="198" y="40" text-anchor="middle" class="font-sans" font-size="17" font-weight="600" fill="#F1F5F9">Snooze · 10 min</text>

    <!-- Primary Unambiguous Dismiss Pill -->
    <g transform="translate(0, 92)">
      <rect x="0" y="0" width="364" height="84" rx="42" fill="#93A8C7"/>
      <circle cx="46" cy="42" r="28" fill="#0B1320"/>
      <g transform="translate(34,30) scale(1.000)" fill="none" stroke="#F1F5F9" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></g>
      <text x="202" y="49" text-anchor="middle" class="font-sans" font-size="20" font-weight="700" fill="#0B1320">Dismiss alarm</text>
    </g>
  </g>
  </g>
</svg>