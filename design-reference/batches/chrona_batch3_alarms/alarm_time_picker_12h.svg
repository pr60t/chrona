<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 412 915" width="412" height="915">
  <title>CHRONA — 12-Hour Time Picker</title>
  <desc>Material 3 12-hour radial and digital time picker with selected/unselected hour, minute, and AM/PM controls.</desc>
  <defs>
    <style>
      .font-sans { font-family: Google Sans, Roboto, -apple-system, BlinkMacSystemFont, sans-serif; }
      .font-mono { font-family: Roboto Mono, monospace; }
      .tnum { font-variant-numeric: tabular-nums; }
    </style>
    <radialGradient id="ringing-glow" cx="50%" cy="34%" r="52%">
      <stop offset="0%" stop-color="#A7E8D8" stop-opacity="0.18"/>
      <stop offset="55%" stop-color="#93A8C7" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip-screen-412x915">
      <rect x="0" y="0" width="412" height="915" rx="36" ry="36"/>
    </clipPath>
  </defs>
  <g id="layer-amoled-canvas" clip-path="url(#clip-screen-412x915)">
    <rect x="0" y="0" width="412" height="915" fill="#000000"/>
  <g id="layer-status-bar">
    <text x="24" y="26" class="font-sans tnum" font-size="13" font-weight="600" fill="#F1F5F9">13:17</text>
    <text x="206" y="26" text-anchor="middle" class="font-mono" font-size="9" fill="#64748B">KATHMANDU · UTC +5:45</text>
    <path d="M352 25 l4 -4 l4 4 M350 22 a8 8 0 0 1 12 0" fill="none" stroke="#F1F5F9" stroke-width="1.4" stroke-linecap="round"/>
    <rect x="370" y="17" width="18" height="10" rx="2.5" fill="none" stroke="#F1F5F9" stroke-width="1.3"/>
    <rect x="372" y="19" width="13" height="6" rx="1" fill="#F1F5F9"/>
  </g>
  <g id="layer-top-app-bar">
    <g transform="translate(16,54) scale(1.000)" fill="none" stroke="#F1F5F9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></g>
    <text x="52" y="72" class="font-sans" font-size="22" font-weight="500" fill="#F1F5F9">Select time (12-hour)</text>
    <g transform="translate(368,54) scale(1.000)" fill="none" stroke="#F1F5F9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="19" r="1.5" fill="currentColor" stroke="none"/></g>
  </g>
  <g id="picker-12h-container" transform="translate(20, 96)">
    <rect x="0" y="0" width="372" height="540" rx="28" fill="#2B3547" stroke="#334155"/>
    <text x="24" y="34" class="font-mono" font-size="11" font-weight="600" fill="#93A8C7">12-HOUR CLOCK · HOUR &amp; MINUTE SELECTION</text>

    <!-- Digital Readout: Selected Hour (07) vs Unselected Minute (30) + AM/PM -->
    <g transform="translate(24, 52)">
      <rect x="0" y="0" width="106" height="80" rx="16" fill="#2A384D" stroke="#93A8C7" stroke-width="1.6"/>
      <text x="53" y="56" text-anchor="middle" class="font-sans tnum" font-size="44" font-weight="500" fill="#DCE6F7">07</text>
      <text x="120" y="54" text-anchor="middle" class="font-sans" font-size="36" fill="#94A3B8">:</text>
      <rect x="134" y="0" width="106" height="80" rx="16" fill="#1A202C" stroke="#1E293B"/>
      <text x="187" y="56" text-anchor="middle" class="font-sans tnum" font-size="44" font-weight="500" fill="#F1F5F9">30</text>

      <!-- AM Selected / PM Unselected -->
      <rect x="254" y="0" width="70" height="38" rx="12" fill="#93A8C7"/>
      <text x="289" y="24" text-anchor="middle" class="font-sans" font-size="14" font-weight="700" fill="#0B1320">AM</text>
      <rect x="254" y="42" width="70" height="38" rx="12" fill="#1A202C" stroke="#1E293B"/>
      <text x="289" y="66" text-anchor="middle" class="font-sans" font-size="14" font-weight="500" fill="#94A3B8">PM</text>
    </g>

    <!-- 12-Hour Radial Dial (Selected 7 highlighted) -->
    <g transform="translate(186, 286)">
      <circle cx="0" cy="0" r="122" fill="#1A202C"/>
      <line x1="0" y1="0" x2="-47" y2="81" stroke="#93A8C7" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="4.5" fill="#93A8C7"/>
      <circle cx="-47" cy="81" r="20" fill="#93A8C7"/><text x="47.0" y="-76.4" text-anchor="middle" class="font-sans tnum" font-size="15" font-weight="500" fill="#F1F5F9">1</text><text x="81.4" y="-42.0" text-anchor="middle" class="font-sans tnum" font-size="15" font-weight="500" fill="#F1F5F9">2</text><text x="94.0" y="5.0" text-anchor="middle" class="font-sans tnum" font-size="15" font-weight="500" fill="#F1F5F9">3</text><text x="81.4" y="52.0" text-anchor="middle" class="font-sans tnum" font-size="15" font-weight="500" fill="#F1F5F9">4</text><text x="47.0" y="86.4" text-anchor="middle" class="font-sans tnum" font-size="15" font-weight="500" fill="#F1F5F9">5</text><text x="0.0" y="99.0" text-anchor="middle" class="font-sans tnum" font-size="15" font-weight="500" fill="#F1F5F9">6</text><text x="-47.0" y="86.4" text-anchor="middle" class="font-sans tnum" font-size="15" font-weight="700" fill="#0B1320">7</text><text x="-81.4" y="52.0" text-anchor="middle" class="font-sans tnum" font-size="15" font-weight="500" fill="#F1F5F9">8</text><text x="-94.0" y="5.0" text-anchor="middle" class="font-sans tnum" font-size="15" font-weight="500" fill="#F1F5F9">9</text><text x="-81.4" y="-42.0" text-anchor="middle" class="font-sans tnum" font-size="15" font-weight="500" fill="#F1F5F9">10</text><text x="-47.0" y="-76.4" text-anchor="middle" class="font-sans tnum" font-size="15" font-weight="500" fill="#F1F5F9">11</text><text x="-0.0" y="-89.0" text-anchor="middle" class="font-sans tnum" font-size="15" font-weight="500" fill="#F1F5F9">12</text>    </g>

    <!-- Bottom Legend &amp; Actions -->
    <text x="24" y="454" class="font-mono" font-size="11" fill="#94A3B8">Selected: 07:30 AM · Unselected slots use #1A202C</text>
    <rect x="172" y="476" width="84" height="42" rx="21" fill="#1A202C"/>
    <text x="214" y="502" text-anchor="middle" class="font-sans" font-size="14" font-weight="600" fill="#F1F5F9">Cancel</text>
    <rect x="268" y="476" width="80" height="42" rx="21" fill="#93A8C7"/>
    <text x="308" y="502" text-anchor="middle" class="font-sans" font-size="14" font-weight="600" fill="#0B1320">OK</text>
  </g>
  <g id="layer-bottom-navigation" transform="translate(0, 835)">
    <rect x="0" y="0" width="412" height="80" fill="#11161F"/>
    <line x1="0" y1="0" x2="412" y2="0" stroke="#1E293B" stroke-width="1"/>
    <g id="nav-dest-1-alarms">
      <rect x="13.2" y="10" width="56" height="32" rx="16" fill="#2A384D"/>
      <g transform="translate(29.200000000000003,14) scale(1.000)" fill="none" stroke="#DCE6F7" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 1.5M5 3L2 6M22 6l-3-3M6.5 19.5L5 21M17.5 19.5L19 21"/></g>
      <text x="41.2" y="59" text-anchor="middle" class="font-sans" font-size="11" font-weight="600" fill="#F1F5F9">Alarms</text>
    </g>
    <g id="nav-dest-2-world-clock">
      
      <g transform="translate(111.60000000000001,14) scale(1.000)" fill="none" stroke="#94A3B8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3.6 9h16.8M3.6 15h16.8M11.5 3a17 17 0 0 0 0 18M12.5 3a17 17 0 0 1 0 18"/></g>
      <text x="123.6" y="59" text-anchor="middle" class="font-sans" font-size="11" font-weight="500" fill="#94A3B8">World Clock</text>
    </g>
    <g id="nav-dest-3-timer">
      
      <g transform="translate(194.0,14) scale(1.000)" fill="none" stroke="#94A3B8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12M6 21h12M7 3v3.5a5 5 0 0 0 2.2 4.1L12 12.5l2.8-1.9A5 5 0 0 0 17 6.5V3M7 21v-3.5a5 5 0 0 1 2.2-4.1L12 11.5l2.8 1.9a5 5 0 0 1 2.2 4.1V21"/></g>
      <text x="206.0" y="59" text-anchor="middle" class="font-sans" font-size="11" font-weight="500" fill="#94A3B8">Timer</text>
    </g>
    <g id="nav-dest-4-stopwatch">
      
      <g transform="translate(276.40000000000003,14) scale(1.000)" fill="none" stroke="#94A3B8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M10 2h4M12 9v4M18 6l1.5-1.5"/></g>
      <text x="288.4" y="59" text-anchor="middle" class="font-sans" font-size="11" font-weight="500" fill="#94A3B8">Stopwatch</text>
    </g>
    <g id="nav-dest-5-bedtime">
      
      <g transform="translate(358.8,14) scale(1.000)" fill="none" stroke="#94A3B8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M19.5 14.5A7.5 7.5 0 0 1 9.5 4.5a7.5 7.5 0 1 0 10 10z"/></g>
      <text x="370.8" y="59" text-anchor="middle" class="font-sans" font-size="11" font-weight="500" fill="#94A3B8">Bedtime</text>
    </g>
  </g>
  </g>
</svg>