<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 412 915" width="412" height="915">
  <title>CHRONA — Full-Screen Alarm Permission</title>
  <desc>Full-screen alarm display education with Continue, Later, and permission unavailable fallback behavior.</desc>
  <defs>
    <style>
      .font-sans { font-family: Google Sans, Roboto, -apple-system, BlinkMacSystemFont, sans-serif; }
      .font-mono { font-family: Roboto Mono, monospace; }
      .tnum { font-variant-numeric: tabular-nums; }
    </style>
    <radialGradient id="ambient-periwinkle" cx="50%" cy="32%" r="48%">
      <stop offset="0%" stop-color="#93A8C7" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#A7E8D8" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip-screen-412x915">
      <rect x="0" y="0" width="412" height="915" rx="36" ry="36"/>
    </clipPath>
  </defs>
  <g id="layer-amoled-canvas" clip-path="url(#clip-screen-412x915)">
    <rect x="0" y="0" width="412" height="915" fill="#000000"/>
  <g id="layer-status-bar">
    <text x="24" y="26" class="font-sans tnum" font-size="13" font-weight="600" fill="#F1F5F9">13:47</text>
    <text x="206" y="26" text-anchor="middle" class="font-mono" font-size="9" fill="#64748B">KATHMANDU · UTC +5:45</text>
    <path d="M352 25 l4 -4 l4 4 M350 22 a8 8 0 0 1 12 0" fill="none" stroke="#F1F5F9" stroke-width="1.4" stroke-linecap="round"/>
    <rect x="370" y="17" width="18" height="10" rx="2.5" fill="none" stroke="#F1F5F9" stroke-width="1.3"/>
    <rect x="372" y="19" width="13" height="6" rx="1" fill="#F1F5F9"/>
  </g>
  <g id="layer-top-app-bar">
    <g transform="translate(16,54) scale(1.000)" fill="none" stroke="#F1F5F9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></g>
    <text x="52" y="72" class="font-sans" font-size="22" font-weight="500" fill="#F1F5F9">Full-screen alerts</text>
    
  </g>
  <g id="permission-fullscreen-panel" transform="translate(20, 102)">
    <rect x="0" y="0" width="372" height="340" rx="24" fill="#1A202C" stroke="#1E293B"/>
    <circle cx="48" cy="48" r="24" fill="#2A384D"/>
    <g transform="translate(36,36) scale(1.000)" fill="none" stroke="#DCE6F7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></g>
    <text x="86" y="44" class="font-sans" font-size="18" font-weight="600" fill="#F1F5F9">Full-screen alarm display</text>
    <text x="86" y="64" class="font-mono" font-size="10.5" fill="#93A8C7">USE_FULL_SCREEN_INTENT</text>

    <text x="20" y="104" class="font-sans" font-size="13.5" fill="#94A3B8">Allows Chrona to display the immersive AMOLED</text>
    <text x="20" y="124" class="font-sans" font-size="13.5" fill="#94A3B8">ringing screen over your lock screen so Snooze</text>
    <text x="20" y="144" class="font-sans" font-size="13.5" fill="#94A3B8">and Dismiss controls are immediately reachable.</text>

    <!-- Continue &amp; Later Actions -->
    <g transform="translate(20, 174)">
      <rect x="0" y="0" width="332" height="50" rx="25" fill="#93A8C7"/>
      <text x="166" y="30" text-anchor="middle" class="font-sans" font-size="15" font-weight="600" fill="#0B1320">Continue</text>

      <rect x="0" y="62" width="332" height="44" rx="22" fill="#222A38" stroke="#334155"/>
      <text x="166" y="89" text-anchor="middle" class="font-sans" font-size="14" font-weight="500" fill="#F1F5F9">Later</text>
    </g>
  </g>

  <!-- Permission Unavailable Fallback State -->
  <g id="fullscreen-unavailable-state" transform="translate(20, 464)">
    <rect x="0" y="0" width="372" height="196" rx="22" fill="#1A202C" stroke="#FCD34D" stroke-width="1.1"/>
    <g transform="translate(20,22) scale(0.833)" fill="none" stroke="#FCD34D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></g>
    <text x="50" y="37" class="font-sans" font-size="14.5" font-weight="600" fill="#F1F5F9">When full-screen access is unavailable</text>
    <text x="20" y="68" class="font-sans" font-size="12.5" fill="#94A3B8">If full-screen intents are turned off in Android</text>
    <text x="20" y="88" class="font-sans" font-size="12.5" fill="#94A3B8">settings, alarms will ring as a high-priority</text>
    <text x="20" y="108" class="font-sans" font-size="12.5" fill="#94A3B8">heads-up notification banner instead of taking</text>
    <text x="20" y="128" class="font-sans" font-size="12.5" fill="#94A3B8">over the entire screen.</text>
    <text x="20" y="164" class="font-mono" font-size="11" fill="#93A8C7">Settings → Notifications → Full-screen alerts</text>
  </g>
  </g>
</svg>