<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 412 915" width="412" height="915">
  <title>CHRONA — Notification Permission Education</title>
  <desc>Android notification permission explanation for alarms, snooze actions, and live timer alerts.</desc>
  <defs>
    <style>
      .font-sans { font-family: Google Sans, Roboto, -apple-system, BlinkMacSystemFont, sans-serif; }
      .font-mono { font-family: Roboto Mono, monospace; }
      .tnum { font-variant-numeric: tabular-nums; }
    </style>
    <radialGradient id="ambient-periwinkle" cx="50%" cy="32%" r="48%">
      <stop offset="0%" stop-color="#93A8C7" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#A7E8D8" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip-screen-412x915">
      <rect x="0" y="0" width="412" height="915" rx="36" ry="36"/>
    </clipPath>
  </defs>
  <g id="layer-amoled-canvas" clip-path="url(#clip-screen-412x915)">
    <rect x="0" y="0" width="412" height="915" fill="#000000"/>
  <g id="layer-status-bar">
    <text x="24" y="26" class="font-sans tnum" font-size="13" font-weight="600" fill="#F1F5F9">13:47</text>
    <text x="206" y="26" text-anchor="middle" class="font-mono" font-size="9" fill="#64748B">KATHMANDU · UTC +5:45</text>
    <path d="M352 25 l4 -4 l4 4 M350 22 a8 8 0 0 1 12 0" fill="none" stroke="#F1F5F9" stroke-width="1.4" stroke-linecap="round"/>
    <rect x="370" y="17" width="18" height="10" rx="2.5" fill="none" stroke="#F1F5F9" stroke-width="1.3"/>
    <rect x="372" y="19" width="13" height="6" rx="1" fill="#F1F5F9"/>
  </g>
  <g id="layer-top-app-bar">
    <g transform="translate(16,54) scale(1.000)" fill="none" stroke="#F1F5F9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></g>
    <text x="52" y="72" class="font-sans" font-size="22" font-weight="500" fill="#F1F5F9">Notifications</text>
    
  </g>
  <g id="permission-notifications-panel" transform="translate(20, 108)">
    <rect x="0" y="0" width="372" height="444" rx="24" fill="#1A202C" stroke="#1E293B"/>
    <circle cx="186" cy="64" r="34" fill="#2A384D"/>
    <g transform="translate(172,50) scale(1.167)" fill="none" stroke="#DCE6F7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0"/></g>

    <text x="186" y="128" text-anchor="middle" class="font-sans" font-size="20" font-weight="600" fill="#F1F5F9">Allow Chrona notifications</text>
    <text x="186" y="154" text-anchor="middle" class="font-sans" font-size="13.5" fill="#94A3B8">Android requires notification permission so</text>
    <text x="186" y="174" text-anchor="middle" class="font-sans" font-size="13.5" fill="#94A3B8">ringing alarms, timers, and bedtime alerts</text>
    <text x="186" y="194" text-anchor="middle" class="font-sans" font-size="13.5" fill="#94A3B8">can appear on your lock screen.</text>

    <!-- Bullet Explanations -->
    <g transform="translate(24, 224)">
      <rect x="0" y="0" width="324" height="56" rx="14" fill="#222A38"/>
      <g transform="translate(16,18) scale(0.833)" fill="none" stroke="#93A8C7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 1.5M5 3L2 6M22 6l-3-3M6.5 19.5L5 21M17.5 19.5L19 21"/></g>
      <text x="48" y="25" class="font-sans" font-size="13" font-weight="600" fill="#F1F5F9">Alarms &amp; Snooze controls</text>
      <text x="48" y="43" class="font-sans" font-size="11.5" fill="#94A3B8">Dismiss or snooze directly from alerts</text>
    </g>
    <g transform="translate(24, 292)">
      <rect x="0" y="0" width="324" height="56" rx="14" fill="#222A38"/>
      <g transform="translate(16,18) scale(0.833)" fill="none" stroke="#A7E8D8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12M6 21h12M7 3v3.5a5 5 0 0 0 2.2 4.1L12 12.5l2.8-1.9A5 5 0 0 0 17 6.5V3M7 21v-3.5a5 5 0 0 1 2.2-4.1L12 11.5l2.8 1.9a5 5 0 0 1 2.2 4.1V21"/></g>
      <text x="48" y="25" class="font-sans" font-size="13" font-weight="600" fill="#F1F5F9">Live Timer countdowns</text>
      <text x="48" y="43" class="font-sans" font-size="11.5" fill="#94A3B8">Track active timers while using other apps</text>
    </g>

    <text x="186" y="382" text-anchor="middle" class="font-mono" font-size="10.5" fill="#64748B">POST_NOTIFICATIONS · SYSTEM PROMPT</text>
  </g>

  <g transform="translate(20, 718)">
    <rect x="0" y="0" width="372" height="52" rx="26" fill="#93A8C7"/>
    <text x="186" y="31" text-anchor="middle" class="font-sans" font-size="15" font-weight="600" fill="#0B1320">Continue</text>

