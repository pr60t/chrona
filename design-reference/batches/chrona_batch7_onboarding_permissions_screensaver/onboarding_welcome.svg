<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 412 915" width="412" height="915">
  <title>CHRONA — Welcome Onboarding</title>
  <desc>Minimal clock artwork, Chrona brand identity, short description, and Continue CTA.</desc>
  <defs>
    <style>
      .font-sans { font-family: Google Sans, Roboto, -apple-system, BlinkMacSystemFont, sans-serif; }
      .font-mono { font-family: Roboto Mono, monospace; }
      .tnum { font-variant-numeric: tabular-nums; }
    </style>
    <radialGradient id="ambient-periwinkle" cx="50%" cy="32%" r="48%">
      <stop offset="0%" stop-color="#93A8C7" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#A7E8D8" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip-screen-412x915">
      <rect x="0" y="0" width="412" height="915" rx="36" ry="36"/>
    </clipPath>
  </defs>
  <g id="layer-amoled-canvas" clip-path="url(#clip-screen-412x915)">
    <rect x="0" y="0" width="412" height="915" fill="#000000"/>
    <rect x="0" y="0" width="412" height="540" fill="url(#ambient-periwinkle)"/>
  <g id="layer-status-bar">
    <text x="24" y="26" class="font-sans tnum" font-size="13" font-weight="600" fill="#F1F5F9">13:47</text>
    <text x="206" y="26" text-anchor="middle" class="font-mono" font-size="9" fill="#64748B">KATHMANDU · UTC +5:45</text>
    <path d="M352 25 l4 -4 l4 4 M350 22 a8 8 0 0 1 12 0" fill="none" stroke="#F1F5F9" stroke-width="1.4" stroke-linecap="round"/>
    <rect x="370" y="17" width="18" height="10" rx="2.5" fill="none" stroke="#F1F5F9" stroke-width="1.3"/>
    <rect x="372" y="19" width="13" height="6" rx="1" fill="#F1F5F9"/>
  </g>
  <g id="welcome-clock-artwork" transform="translate(206, 286)">
    <!-- Minimal Geometric Clock Artwork matching Chrona App Icon -->
    <circle cx="0" cy="0" r="118" fill="none" stroke="#1E293B" stroke-width="1"/>
    <circle cx="0" cy="0" r="92" fill="#080B10" stroke="#334155" stroke-width="1.5"/>
    <!-- Pastel Timezone Ring Segments -->
    <path d="M 0 -74 A 74 74 0 0 1 74 0" fill="none" stroke="#A7E8D8" stroke-width="5" stroke-linecap="round"/>
    <path d="M 74 0 A 74 74 0 0 1 0 74" fill="none" stroke="#B8C7F2" stroke-width="5" stroke-linecap="round"/>
    <path d="M 0 74 A 74 74 0 0 1 -74 0" fill="none" stroke="#F4C2A1" stroke-width="5" stroke-linecap="round"/>
    <path d="M -74 0 A 74 74 0 0 1 0 -74" fill="none" stroke="#93A8C7" stroke-width="5" stroke-linecap="round"/>
    <!-- Precision Hands -->
    <line x1="0" y1="0" x2="0" y2="-42" stroke="#F1F5F9" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="32" y2="18" stroke="#93A8C7" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="5" fill="#F1F5F9"/>
  </g>

  <g id="welcome-brand-copy" transform="translate(20, 464)">
    <text x="186" y="0" text-anchor="middle" class="font-mono" font-size="11.5" font-weight="600" letter-spacing="2.4" fill="#93A8C7">WELCOME TO</text>
    <text x="186" y="44" text-anchor="middle" class="font-sans" font-size="38" font-weight="600" letter-spacing="2" fill="#F1F5F9">CHRONA</text>
    <text x="186" y="82" text-anchor="middle" class="font-sans" font-size="15" fill="#94A3B8">A quiet, Pixel-inspired world clock</text>
    <text x="186" y="104" text-anchor="middle" class="font-sans" font-size="15" fill="#94A3B8">and cross-timezone alarm instrument.</text>
  </g>

  <g id="onboarding-progress-dots" transform="translate(206, 756)">
  <rect x="-37.0" y="-4" width="20" height="8" rx="4" fill="#93A8C7"/>
  <circle cx="-9.0" cy="0" r="4" fill="#334155"/>
  <circle cx="9.0" cy="0" r="4" fill="#334155"/>
  <circle cx="27.0" cy="0" r="4" fill="#334155"/>
</g>

  <g id="cta-welcome-continue" transform="translate(20, 788)">
    <rect x="0" y="0" width="372" height="54" rx="27" fill="#93A8C7"/>
    <text x="186" y="33" text-anchor="middle" class="font-sans" font-size="16" font-weight="600" fill="#0B1320">Continue</text>
  </g>
  </g>
</svg>