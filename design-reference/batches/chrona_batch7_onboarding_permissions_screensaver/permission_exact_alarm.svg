<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 412 915" width="412" height="915">
  <title>CHRONA — Exact Alarm Access &amp; Recovery</title>
  <desc>Native Android exact-alarm permission education with current status, system settings action, and recovery steps.</desc>
  <defs>
    <style>
      .font-sans { font-family: Google Sans, Roboto, -apple-system, BlinkMacSystemFont, sans-serif; }
      .font-mono { font-family: Roboto Mono, monospace; }
      .tnum { font-variant-numeric: tabular-nums; }
    </style>
    <radialGradient id="ambient-periwinkle" cx="50%" cy="32%" r="48%">
      <stop offset="0%" stop-color="#93A8C7" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#A7E8D8" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip-screen-412x915">
      <rect x="0" y="0" width="412" height="915" rx="36" ry="36"/>
    </clipPath>
  </defs>
  <g id="layer-amoled-canvas" clip-path="url(#clip-screen-412x915)">
    <rect x="0" y="0" width="412" height="915" fill="#000000"/>
  <g id="layer-status-bar">
    <text x="24" y="26" class="font-sans tnum" font-size="13" font-weight="600" fill="#F1F5F9">13:47</text>
    <text x="206" y="26" text-anchor="middle" class="font-mono" font-size="9" fill="#64748B">KATHMANDU · UTC +5:45</text>
    <path d="M352 25 l4 -4 l4 4 M350 22 a8 8 0 0 1 12 0" fill="none" stroke="#F1F5F9" stroke-width="1.4" stroke-linecap="round"/>
    <rect x="370" y="17" width="18" height="10" rx="2.5" fill="none" stroke="#F1F5F9" stroke-width="1.3"/>
    <rect x="372" y="19" width="13" height="6" rx="1" fill="#F1F5F9"/>
  </g>
  <g id="layer-top-app-bar">
    <g transform="translate(16,54) scale(1.000)" fill="none" stroke="#F1F5F9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></g>
    <text x="52" y="72" class="font-sans" font-size="22" font-weight="500" fill="#F1F5F9">Exact alarm access</text>
    
  </g>
  <g id="permission-exact-alarm-panel" transform="translate(20, 102)">
    <rect x="0" y="0" width="372" height="332" rx="24" fill="#1A202C" stroke="#1E293B"/>
    <circle cx="48" cy="48" r="24" fill="#2A384D"/>
    <g transform="translate(36,36) scale(1.000)" fill="none" stroke="#DCE6F7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></g>
    <text x="86" y="44" class="font-sans" font-size="18" font-weight="600" fill="#F1F5F9">Precise alarm scheduling</text>
    <text x="86" y="64" class="font-mono" font-size="10.5" fill="#93A8C7">ALARMS &amp; REMINDERS ACCESS</text>

    <text x="20" y="104" class="font-sans" font-size="13.5" fill="#94A3B8">Chrona needs Android's exact-alarm permission so</text>
    <text x="20" y="124" class="font-sans" font-size="13.5" fill="#94A3B8">local and cross-timezone alarms fire at the exact</text>
    <text x="20" y="144" class="font-sans" font-size="13.5" fill="#94A3B8">scheduled second, even during deep device sleep.</text>

    <!-- Permission Status Row -->
    <g transform="translate(20, 172)">
      <rect x="0" y="0" width="332" height="58" rx="16" fill="#222A38" stroke="#FCD34D"/>
      <text x="16" y="24" class="font-mono" font-size="10" fill="#94A3B8">CURRENT SYSTEM STATUS</text>
      <text x="16" y="44" class="font-sans" font-size="14" font-weight="600" fill="#FCD34D">Not yet granted</text>
      <text x="316" y="36" text-anchor="end" class="font-mono" font-size="11" fill="#94A3B8">Android Settings</text>
    </g>

    <!-- Continue to Android System Settings -->
    <g transform="translate(20, 250)">
      <rect x="0" y="0" width="332" height="52" rx="26" fill="#93A8C7"/>
      <g transform="translate(66,16) scale(0.750)" fill="none" stroke="#0B1320" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14L21 3"/></g>
      <text x="180" y="31" text-anchor="middle" class="font-sans" font-size="14.5" font-weight="600" fill="#0B1320">Open Android alarm settings</text>
    </g>
  </g>

  <!-- Recovery State Card -->
  <g id="exact-alarm-recovery-state" transform="translate(20, 454)">
    <rect x="0" y="0" width="372" height="196" rx="22" fill="#11161F" stroke="#334155"/>
    <text x="20" y="30" class="font-mono" font-size="10.5" font-weight="600" fill="#93A8C7">RECOVERY STATE · IF DENIED OR REVOKED</text>
    <text x="20" y="56" class="font-sans" font-size="14" font-weight="600" fill="#F1F5F9">How to restore exact scheduling</text>
    <text x="20" y="82" class="font-sans" font-size="12.5" fill="#94A3B8">1. Open System Settings → Apps → Chrona</text>
    <text x="20" y="104" class="font-sans" font-size="12.5" fill="#94A3B8">2. Select "Alarms &amp; reminders"</text>
    <text x="20" y="126" class="font-sans" font-size="12.5" fill="#94A3B8">3. Turn on "Allow setting alarms and reminders"</text>
    <text x="20" y="164" class="font-mono" font-size="11" fill="#6EE7B7">Chrona re-verifies automatically on return.</text>
  </g>
  </g>
</svg>