<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 412 915" width="412" height="915">
  <title>CHRONA Screensaver — Minimal Digital Clock</title>
  <desc>Pure pitch-black AMOLED nightstand digital clock with subtle date and next alarm whisper.</desc>
  <defs>
    <style>
      .font-sans { font-family: Google Sans, Roboto, -apple-system, BlinkMacSystemFont, sans-serif; }
      .font-mono { font-family: Roboto Mono, monospace; }
      .tnum { font-variant-numeric: tabular-nums; }
    </style>
    <radialGradient id="ambient-periwinkle" cx="50%" cy="32%" r="48%">
      <stop offset="0%" stop-color="#93A8C7" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#A7E8D8" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip-screen-412x915">
      <rect x="0" y="0" width="412" height="915" rx="36" ry="36"/>
    </clipPath>
  </defs>
  <g id="layer-amoled-canvas" clip-path="url(#clip-screen-412x915)">
    <rect x="0" y="0" width="412" height="915" fill="#000000"/>
  <g id="screensaver-minimal-clock" transform="translate(206, 430)">
    <text x="0" y="0" text-anchor="middle" class="font-sans tnum" font-size="92" font-weight="300" letter-spacing="-2" fill="#F1F5F9" opacity="0.88">02:14</text>
    <text x="0" y="42" text-anchor="middle" class="font-sans" font-size="16" font-weight="400" letter-spacing="0.5" fill="#94A3B8" opacity="0.72">Friday, November 20</text>
    <!-- Subtle Next Alarm Whisper -->
    <g transform="translate(-44, 72)" opacity="0.55">
      <g transform="translate(0,0) scale(0.667)" fill="none" stroke="#93A8C7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 1.5M5 3L2 6M22 6l-3-3M6.5 19.5L5 21M17.5 19.5L19 21"/></g>
      <text x="24" y="13" class="font-mono tnum" font-size="12" fill="#93A8C7">06:30</text>
    </g>
  </g>
  </g>
</svg>