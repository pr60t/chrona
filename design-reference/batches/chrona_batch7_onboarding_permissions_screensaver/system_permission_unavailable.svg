<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 412 915" width="412" height="915">
  <title>CHRONA System States — Permissions Unavailable</title>
  <desc>Alarm permission unavailable and notifications disabled system states with legitimate Android Settings links.</desc>
  <defs>
    <style>
      .font-sans { font-family: Google Sans, Roboto, -apple-system, BlinkMacSystemFont, sans-serif; }
      .font-mono { font-family: Roboto Mono, monospace; }
      .tnum { font-variant-numeric: tabular-nums; }
    </style>
    <radialGradient id="ambient-periwinkle" cx="50%" cy="32%" r="48%">
      <stop offset="0%" stop-color="#93A8C7" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#A7E8D8" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip-screen-412x915">
      <rect x="0" y="0" width="412" height="915" rx="36" ry="36"/>
    </clipPath>
  </defs>
  <g id="layer-amoled-canvas" clip-path="url(#clip-screen-412x915)">
    <rect x="0" y="0" width="412" height="915" fill="#000000"/>
  <g id="layer-status-bar">
    <text x="24" y="26" class="font-sans tnum" font-size="13" font-weight="600" fill="#F1F5F9">13:47</text>
    <text x="206" y="26" text-anchor="middle" class="font-mono" font-size="9" fill="#64748B">KATHMANDU · UTC +5:45</text>
    <path d="M352 25 l4 -4 l4 4 M350 22 a8 8 0 0 1 12 0" fill="none" stroke="#F1F5F9" stroke-width="1.4" stroke-linecap="round"/>
    <rect x="370" y="17" width="18" height="10" rx="2.5" fill="none" stroke="#F1F5F9" stroke-width="1.3"/>
    <rect x="372" y="19" width="13" height="6" rx="1" fill="#F1F5F9"/>
  </g>
  <g id="layer-top-app-bar">
    <g transform="translate(16,54) scale(1.000)" fill="none" stroke="#F1F5F9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></g>
    <text x="52" y="72" class="font-sans" font-size="22" font-weight="500" fill="#F1F5F9">System permissions</text>
    
  </g>
  <!-- 1. Alarm Permission Unavailable -->
  <g id="state-alarm-permission-unavailable" transform="translate(20, 102)">
    <text x="0" y="14" class="font-mono" font-size="10.5" font-weight="600" fill="#FCA5A5">1 · ALARM PERMISSION UNAVAILABLE</text>
    <rect x="0" y="24" width="372" height="224" rx="22" fill="#1A202C" stroke="#FCA5A5" stroke-width="1.2"/>
    <circle cx="42" cy="64" r="20" fill="#3F1518"/>
    <g transform="translate(32,54) scale(0.833)" fill="none" stroke="#FCA5A5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 1.5M5 3L2 6M22 6l-3-3M6.5 19.5L5 21M17.5 19.5L19 21"/></g>
    <text x="74" y="60" class="font-sans" font-size="16" font-weight="600" fill="#F1F5F9">Exact-alarm access turned off</text>
    <text x="74" y="80" class="font-mono" font-size="10.5" fill="#FCA5A5">SCHEDULE_EXACT_ALARM · DENIED</text>
    <text x="20" y="114" class="font-sans" font-size="13" fill="#94A3B8">Scheduled alarms may ring late until exact-alarm</text>
    <text x="20" y="134" class="font-sans" font-size="13" fill="#94A3B8">permission is enabled in Android system settings.</text>

    <rect x="20" y="162" width="332" height="46" rx="23" fill="#93A8C7"/>
    <text x="186" y="190" text-anchor="middle" class="font-sans" font-size="14" font-weight="600" fill="#0B1320">Open system settings</text>
  </g>

  <!-- 2. Notifications Disabled -->
  <g id="state-notifications-disabled" transform="translate(20, 376)">
    <text x="0" y="14" class="font-mono" font-size="10.5" font-weight="600" fill="#FCD34D">2 · NOTIFICATIONS DISABLED</text>
    <rect x="0" y="24" width="372" height="224" rx="22" fill="#1A202C" stroke="#FCD34D" stroke-width="1.2"/>
    <circle cx="42" cy="64" r="20" fill="#3A2D12"/>
    <g transform="translate(32,54) scale(0.833)" fill="none" stroke="#FCD34D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13.73 21a2 2 0 0 1-3.46 0M18.63 13A17.89 17.89 0 0 1 18 8M6.26 6.26A5.86 5.86 0 0 0 6 8c0 7-3 9-3 9h14M18 8a6 6 0 0 0-9.33-5M1 1l22 22"/></g>
    <text x="74" y="60" class="font-sans" font-size="16" font-weight="600" fill="#F1F5F9">Chrona notifications are blocked</text>
    <text x="74" y="80" class="font-mono" font-size="10.5" fill="#FCD34D">POST_NOTIFICATIONS · BLOCKED</text>
    <text x="20" y="114" class="font-sans" font-size="13" fill="#94A3B8">Timer countdowns, bedtime wind-down alerts,</text>
    <text x="20" y="134" class="font-sans" font-size="13" fill="#94A3B8">and lock-screen alarm banners will not appear.</text>

    <rect x="20" y="162" width="332" height="46" rx="23" fill="#222A38" stroke="#93A8C7"/>
    <text x="186" y="190" text-anchor="middle" class="font-sans" font-size="14" font-weight="600" fill="#93A8C7">Enable in app info</text>
  </g>
  <g id="layer-bottom-navigation" transform="translate(0, 835)">
    <rect x="0" y="0" width="412" height="80" fill="#11161F"/>
    <line x1="0" y1="0" x2="412" y2="0" stroke="#1E293B" stroke-width="1"/>
    <g id="nav-dest-1-alarms">
      <rect x="13.2" y="10" width="56" height="32" rx="16" fill="#2A384D"/>
      <g transform="translate(29.200000000000003,14) scale(1.000)" fill="none" stroke="#DCE6F7" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 1.5M5 3L2 6M22 6l-3-3M6.5 19.5L5 21M17.5 19.5L19 21"/></g>
      <text x="41.2" y="59" text-anchor="middle" class="font-sans" font-size="11" font-weight="600" fill="#F1F5F9">Alarms</text>
    </g>
    <g id="nav-dest-2-world-clock">
      
      <g transform="translate(111.60000000000001,14) scale(1.000)" fill="none" stroke="#94A3B8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3.6 9h16.8M3.6 15h16.8M11.5 3a17 17 0 0 0 0 18M12.5 3a17 17 0 0 1 0 18"/></g>
      <text x="123.6" y="59" text-anchor="middle" class="font-sans" font-size="11" font-weight="500" fill="#94A3B8">World Clock</text>
    </g>
    <g id="nav-dest-3-timer">
      
      <g transform="translate(194.0,14) scale(1.000)" fill="none" stroke="#94A3B8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12M6 21h12M7 3v3.5a5 5 0 0 0 2.2 4.1L12 12.5l2.8-1.9A5 5 0 0 0 17 6.5V3M7 21v-3.5a5 5 0 0 1 2.2-4.1L12 11.5l2.8 1.9a5 5 0 0 1 2.2 4.1V21"/></g>
      <text x="206.0" y="59" text-anchor="middle" class="font-sans" font-size="11" font-weight="500" fill="#94A3B8">Timer</text>
    </g>
    <g id="nav-dest-4-stopwatch">
      
      <g transform="translate(276.40000000000003,14) scale(1.000)" fill="none" stroke="#94A3B8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M10 2h4M12 9v4M18 6l1.5-1.5"/></g>
      <text x="288.4" y="59" text-anchor="middle" class="font-sans" font-size="11" font-weight="500" fill="#94A3B8">Stopwatch</text>
    </g>
    <g id="nav-dest-5-bedtime">
      
      <g transform="translate(358.8,14) scale(1.000)" fill="none" stroke="#94A3B8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M19.5 14.5A7.5 7.5 0 0 1 9.5 4.5a7.5 7.5 0 1 0 10 10z"/></g>
      <text x="370.8" y="59" text-anchor="middle" class="font-sans" font-size="11" font-weight="500" fill="#94A3B8">Bedtime</text>
    </g>
  </g>
  </g>
