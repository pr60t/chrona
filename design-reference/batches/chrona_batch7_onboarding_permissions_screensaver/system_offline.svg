<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 412 915" width="412" height="915">
  <title>CHRONA System States — Offline &amp; Missing Weather</title>
  <desc>Offline status notice and missing weather data fallback while preserving exact clock functionality.</desc>
  <defs>
    <style>
      .font-sans { font-family: Google Sans, Roboto, -apple-system, BlinkMacSystemFont, sans-serif; }
      .font-mono { font-family: Roboto Mono, monospace; }
      .tnum { font-variant-numeric: tabular-nums; }
    </style>
    <radialGradient id="ambient-periwinkle" cx="50%" cy="32%" r="48%">
      <stop offset="0%" stop-color="#93A8C7" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#A7E8D8" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip-screen-412x915">
      <rect x="0" y="0" width="412" height="915" rx="36" ry="36"/>
    </clipPath>
  </defs>
  <g id="layer-amoled-canvas" clip-path="url(#clip-screen-412x915)">
    <rect x="0" y="0" width="412" height="915" fill="#000000"/>
  <g id="layer-status-bar">
    <text x="24" y="26" class="font-sans tnum" font-size="13" font-weight="600" fill="#F1F5F9">13:47</text>
    <text x="206" y="26" text-anchor="middle" class="font-mono" font-size="9" fill="#64748B">KATHMANDU · UTC +5:45</text>
    <path d="M352 25 l4 -4 l4 4 M350 22 a8 8 0 0 1 12 0" fill="none" stroke="#F1F5F9" stroke-width="1.4" stroke-linecap="round"/>
    <rect x="370" y="17" width="18" height="10" rx="2.5" fill="none" stroke="#F1F5F9" stroke-width="1.3"/>
    <rect x="372" y="19" width="13" height="6" rx="1" fill="#F1F5F9"/>
  </g>
  <g id="layer-top-app-bar">
    
    <text x="20" y="72" class="font-sans" font-size="22" font-weight="500" fill="#F1F5F9">World Clock</text>
    
  </g>
  <!-- Offline Status State -->
  <g id="state-offline-banner" transform="translate(20, 102)">
    <text x="0" y="14" class="font-mono" font-size="10.5" font-weight="600" fill="#FCD34D">1 · OFFLINE STATE</text>
    <rect x="0" y="24" width="372" height="128" rx="20" fill="#1A202C" stroke="#FCD34D" stroke-width="1.2"/>
    <circle cx="42" cy="64" r="20" fill="#3A2D12"/>
    <g transform="translate(32,54) scale(0.833)" fill="none" stroke="#FCD34D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2l20 20M17.5 19H9a4 4 0 0 1-.8-7.9M14.5 7.2A5 5 0 0 1 19.5 13c0 .8-.3 1.6-.8 2.2"/></g>
    <text x="74" y="60" class="font-sans" font-size="16" font-weight="600" fill="#F1F5F9">You're offline</text>
    <text x="74" y="80" class="font-sans" font-size="12.5" fill="#94A3B8">All world clocks &amp; alarms continue accurately.</text>
    <text x="74" y="100" class="font-sans" font-size="12.5" fill="#94A3B8">Live weather updates will resume online.</text>
  </g>

  <!-- Missing Weather Data State -->
  <g id="state-missing-weather" transform="translate(20, 286)">
    <text x="0" y="14" class="font-mono" font-size="10.5" font-weight="600" fill="#94A3B8">2 · MISSING WEATHER DATA</text>
    <rect x="0" y="24" width="372" height="132" rx="20" fill="#1A202C" stroke="#1E293B"/>
    <rect x="14" y="38" width="4" height="104" rx="2" fill="#B8C7F2"/>
    <text x="28" y="60" class="font-sans" font-size="18" font-weight="600" fill="#F1F5F9">London · England</text>
    <text x="354" y="62" text-anchor="end" class="font-sans tnum" font-size="24" font-weight="500" fill="#F1F5F9">07:32</text>
    <line x1="28" y1="80" x2="354" y2="80" stroke="#1E293B"/>
    <g transform="translate(28,96) scale(0.750)" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2l20 20M17.5 19H9a4 4 0 0 1-.8-7.9M14.5 7.2A5 5 0 0 1 19.5 13c0 .8-.3 1.6-.8 2.2"/></g>
    <text x="54" y="110" class="font-sans" font-size="12.5" fill="#64748B">Weather data unavailable for this location</text>
    <text x="354" y="110" text-anchor="end" class="font-mono" font-size="13" fill="#64748B">--°</text>
  </g>
  <g id="layer-bottom-navigation" transform="translate(0, 835)">
    <rect x="0" y="0" width="412" height="80" fill="#11161F"/>
    <line x1="0" y1="0" x2="412" y2="0" stroke="#1E293B" stroke-width="1"/>
    <g id="nav-dest-1-alarms">
      
      <g transform="translate(29.200000000000003,14) scale(1.000)" fill="none" stroke="#94A3B8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 1.5M5 3L2 6M22 6l-3-3M6.5 19.5L5 21M17.5 19.5L19 21"/></g>
      <text x="41.2" y="59" text-anchor="middle" class="font-sans" font-size="11" font-weight="500" fill="#94A3B8">Alarms</text>
    </g>
    <g id="nav-dest-2-world-clock">
      <rect x="95.6" y="10" width="56" height="32" rx="16" fill="#2A384D"/>
      <g transform="translate(111.60000000000001,14) scale(1.000)" fill="none" stroke="#DCE6F7" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3.6 9h16.8M3.6 15h16.8M11.5 3a17 17 0 0 0 0 18M12.5 3a17 17 0 0 1 0 18"/></g>
      <text x="123.6" y="59" text-anchor="middle" class="font-sans" font-size="11" font-weight="600" fill="#F1F5F9">World Clock</text>
    </g>
    <g id="nav-dest-3-timer">
      
      <g transform="translate(194.0,14) scale(1.000)" fill="none" stroke="#94A3B8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12M6 21h12M7 3v3.5a5 5 0 0 0 2.2 4.1L12 12.5l2.8-1.9A5 5 0 0 0 17 6.5V3M7 21v-3.5a5 5 0 0 1 2.2-4.1L12 11.5l2.8 1.9a5 5 0 0 1 2.2 4.1V21"/></g>
      <text x="206.0" y="59" text-anchor="middle" class="font-sans" font-size="11" font-weight="500" fill="#94A3B8">Timer</text>
    </g>
    <g id="nav-dest-4-stopwatch">
      
      <g transform="translate(276.40000000000003,14) scale(1.000)" fill="none" stroke="#94A3B8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M10 2h4M12 9v4M18 6l1.5-1.5"/></g>
      <text x="288.4" y="59" text-anchor="middle" class="font-sans" font-size="11" font-weight="500" fill="#94A3B8">Stopwatch</text>
    </g>
    <g id="nav-dest-5-bedtime">
      
      <g transform="translate(358.8,14) scale(1.000)" fill="none" stroke="#94A3B8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M19.5 14.5A7.5 7.5 0 0 1 9.5 4.5a7.5 7.5 0 1 0 10 10z"/></g>
      <text x="370.8" y="59" text-anchor="middle" class="font-sans" font-size="11" font-weight="500" fill="#94A3B8">Bedtime</text>
    </g>
  </g>
  </g>
</svg>