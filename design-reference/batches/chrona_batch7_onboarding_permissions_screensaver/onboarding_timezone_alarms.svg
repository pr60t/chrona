<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 412 915" width="412" height="915">
  <title>CHRONA Onboarding — Cross-Timezone Intelligence</title>
  <desc>Feature introduction screen 3 demonstrating destination alarm time converted to local phone ring time.</desc>
  <defs>
    <style>
      .font-sans { font-family: Google Sans, Roboto, -apple-system, BlinkMacSystemFont, sans-serif; }
      .font-mono { font-family: Roboto Mono, monospace; }
      .tnum { font-variant-numeric: tabular-nums; }
    </style>
    <radialGradient id="ambient-periwinkle" cx="50%" cy="32%" r="48%">
      <stop offset="0%" stop-color="#93A8C7" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#A7E8D8" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip-screen-412x915">
      <rect x="0" y="0" width="412" height="915" rx="36" ry="36"/>
    </clipPath>
  </defs>
  <g id="layer-amoled-canvas" clip-path="url(#clip-screen-412x915)">
    <rect x="0" y="0" width="412" height="915" fill="#000000"/>
  <g id="layer-status-bar">
    <text x="24" y="26" class="font-sans tnum" font-size="13" font-weight="600" fill="#F1F5F9">13:47</text>
    <text x="206" y="26" text-anchor="middle" class="font-mono" font-size="9" fill="#64748B">KATHMANDU · UTC +5:45</text>
    <path d="M352 25 l4 -4 l4 4 M350 22 a8 8 0 0 1 12 0" fill="none" stroke="#F1F5F9" stroke-width="1.4" stroke-linecap="round"/>
    <rect x="370" y="17" width="18" height="10" rx="2.5" fill="none" stroke="#F1F5F9" stroke-width="1.3"/>
    <rect x="372" y="19" width="13" height="6" rx="1" fill="#F1F5F9"/>
  </g>
  <g id="layer-top-app-bar">
    
    <text x="20" y="72" class="font-sans" font-size="22" font-weight="500" fill="#F1F5F9"></text>
    
  </g>
  <g id="artwork-tz-intelligence" transform="translate(20, 128)">
    <rect x="0" y="0" width="372" height="316" rx="26" fill="#080B10" stroke="#1E293B"/>
    <!-- Dual-Time Comparison Illustration -->
    <g transform="translate(24, 42)">
      <rect x="0" y="0" width="324" height="102" rx="18" fill="#1A202C" stroke="#A7E8D8" stroke-width="1.3"/>
      <rect x="14" y="14" width="4" height="74" rx="2" fill="#A7E8D8"/>
      <text x="28" y="32" class="font-mono" font-size="10" font-weight="600" fill="#A7E8D8">ALARM TIME IN WARSAW</text>
      <text x="28" y="72" class="font-sans tnum" font-size="34" font-weight="500" fill="#F1F5F9">09:00</text>
      <text x="306" y="68" text-anchor="end" class="font-sans" font-size="12" fill="#94A3B8">UTC +1</text>
    </g>

    <g transform="translate(24, 162)">
      <rect x="0" y="0" width="324" height="102" rx="18" fill="#222A38" stroke="#93A8C7" stroke-width="1.3"/>
      <rect x="14" y="14" width="4" height="74" rx="2" fill="#F2DF9B"/>
      <text x="28" y="32" class="font-mono" font-size="10" font-weight="600" fill="#93A8C7">YOUR PHONE RINGS AT (LOCAL)</text>
      <text x="28" y="72" class="font-sans tnum" font-size="34" font-weight="600" fill="#F1F5F9">13:45</text>
      <text x="306" y="68" text-anchor="end" class="font-sans" font-size="12" fill="#6EE7B7">Auto-DST</text>
    </g>
  </g>

  <g transform="translate(20, 488)">
    <text x="186" y="0" text-anchor="middle" class="font-mono" font-size="11" font-weight="600" fill="#93A8C7">03 · CROSS-TIMEZONE INTELLIGENCE</text>
    <text x="186" y="38" text-anchor="middle" class="font-sans" font-size="26" font-weight="600" fill="#F1F5F9">Schedule in any city's time</text>
    <text x="186" y="74" text-anchor="middle" class="font-sans" font-size="14.5" fill="#94A3B8">Set alarms in a destination timezone and</text>
    <text x="186" y="96" text-anchor="middle" class="font-sans" font-size="14.5" fill="#94A3B8">always see the exact local time your phone rings.</text>
  </g>

  <g id="onboarding-progress-dots" transform="translate(206, 756)">
  <circle cx="-27.0" cy="0" r="4" fill="#334155"/>
  <circle cx="-9.0" cy="0" r="4" fill="#334155"/>
  <circle cx="9.0" cy="0" r="4" fill="#334155"/>
  <rect x="17.0" y="-4" width="20" height="8" rx="4" fill="#93A8C7"/>
</g>

  <g transform="translate(20, 788)">
    <rect x="0" y="0" width="372" height="54" rx="27" fill="#93A8C7"/>
    <text x="186" y="33" text-anchor="middle" class="font-sans" font-size="16" font-weight="600" fill="#0B1320">Get started</text>
  </g>
  </g>
</svg>