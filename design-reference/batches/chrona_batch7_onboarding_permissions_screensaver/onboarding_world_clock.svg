<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 412 915" width="412" height="915">
  <title>CHRONA Onboarding — World Clock</title>
  <desc>Feature introduction screen 2 showcasing the slate world map and color-linked city cards.</desc>
  <defs>
