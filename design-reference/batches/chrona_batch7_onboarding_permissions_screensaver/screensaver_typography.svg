<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 412 915" width="412" height="915">
  <title>CHRONA Screensaver — Typography Clock</title>
  <desc>Oversized stacked typographic clock composition on pure pitch-black AMOLED.</desc>
  <defs>
    <style>
      .font-sans { font-family: Google Sans, Roboto, -apple-system, BlinkMacSystemFont, sans-serif; }
      .font-mono { font-family: Roboto Mono, monospace; }
      .tnum { font-variant-numeric: tabular-nums; }
    </style>
    <radialGradient id="ambient-periwinkle" cx="50%" cy="32%" r="48%">
      <stop offset="0%" stop-color="#93A8C7" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#A7E8D8" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip-screen-412x915">
      <rect x="0" y="0" width="412" height="915" rx="36" ry="36"/>
    </clipPath>
  </defs>
  <g id="layer-amoled-canvas" clip-path="url(#clip-screen-412x915)">
    <rect x="0" y="0" width="412" height="915" fill="#000000"/>
  <g id="screensaver-typography-clock" transform="translate(206, 355)">
    <!-- Oversized Stacked Hours &amp; Minutes -->
    <text x="0" y="0" text-anchor="middle" class="font-sans tnum" font-size="168" font-weight="600" letter-spacing="-6" fill="#F1F5F9" opacity="0.86">02</text>
    <text x="0" y="154" text-anchor="middle" class="font-sans tnum" font-size="168" font-weight="300" letter-spacing="-6" fill="#93A8C7" opacity="0.82">14</text>
    <line x1="-28" y1="194" x2="28" y2="194" stroke="#1E293B" stroke-width="1.5"/>
    <text x="0" y="224" text-anchor="middle" class="font-mono" font-size="12" letter-spacing="2" fill="#94A3B8" opacity="0.7">FRI · NOV 20</text>
  </g>
  </g>
</svg>