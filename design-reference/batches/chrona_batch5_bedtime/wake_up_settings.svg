    <g transform="translate(16,19) scale(0.833)" fill="none" stroke="#6EE7B7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></g>
    <text x="46" y="26" class="font-sans" font-size="13.5" font-weight="600" fill="#F1F5F9">Wake-up alarm configured · 06:30</text>
    <text x="46" y="44" class="font-sans" font-size="11.5" fill="#94A3B8">Synced with Bedtime schedule (Mon–Fri)</text>
  </g>

  <!-- Sound, Gradual Volume, Vibration, Snooze Card -->
  <g id="wakeup-audio-haptics-card" transform="translate(20, 166)">
    <rect x="0" y="0" width="372" height="278" rx="20" fill="#1A202C" stroke="#1E293B"/>
    <!-- Alarm Sound -->
    <g transform="translate(18,18) scale(0.833)" fill="none" stroke="#93A8C7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0"/></g>
    <text x="50" y="33" class="font-sans" font-size="14" fill="#F1F5F9">Alarm sound</text>
    <text x="354" y="33" text-anchor="end" class="font-sans" font-size="13" font-weight="500" fill="#93A8C7">Morning Dew</text>
    <line x1="18" y1="58" x2="354" y2="58" stroke="#1E293B"/>

    <!-- Gradual Volume -->
    <g transform="translate(18,76) scale(0.833)" fill="none" stroke="#93A8C7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07M19.07 4.93a10 10 0 0 1 0 14.14"/></g>
    <text x="50" y="88" class="font-sans" font-size="14" fill="#F1F5F9">Gradual volume</text>
    <text x="50" y="106" class="font-sans" font-size="11.5" fill="#94A3B8">Gentle crescendo over 45 seconds</text>
    <rect x="50" y="118" width="236" height="6" rx="3" fill="#2B3547"/>
    <rect x="50" y="118" width="180" height="6" rx="3" fill="#93A8C7"/>
    <circle cx="230" cy="121" r="8" fill="#93A8C7"/>
    <text x="354" y="125" text-anchor="end" class="font-mono" font-size="11" fill="#F1F5F9">45s</text>
    <line x1="18" y1="146" x2="354" y2="146" stroke="#1E293B"/>

    <!-- Vibration -->
    <g transform="translate(18,164) scale(0.833)" fill="none" stroke="#93A8C7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="4" width="8" height="16" rx="2"/><path d="M4 8v8M20 8v8M2 10v4M22 10v4"/></g>
    <text x="50" y="179" class="font-sans" font-size="14" fill="#F1F5F9">Vibration</text>
    <g transform="translate(302,158)"><rect x="0" y="0" width="52" height="32" rx="16" fill="#93A8C7" stroke="none" stroke-width="1.2"/><circle cx="36" cy="16" r="11" fill="#0B1320"/></g>
    <line x1="18" y1="206" x2="354" y2="206" stroke="#1E293B"/>

    <!-- Snooze Duration -->
    <g transform="translate(18,226) scale(0.833)" fill="none" stroke="#93A8C7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 8h6l-6 8h6M15 4h4l-4 5h4"/></g>
    <text x="50" y="241" class="font-sans" font-size="14" fill="#F1F5F9">Snooze duration</text>
    <rect x="272" y="221" width="82" height="30" rx="15" fill="#2A384D"/>
    <text x="313" y="240" text-anchor="middle" class="font-mono" font-size="12" font-weight="600" fill="#DCE6F7">10 min</text>
  </g>

  <!-- Wake-Up Behavior Card -->
  <g id="wakeup-behavior-card" transform="translate(20, 460)">
    <rect x="0" y="0" width="372" height="168" rx="20" fill="#1A202C" stroke="#1E293B"/>
    <text x="18" y="28" class="font-sans" font-size="14" font-weight="600" fill="#F1F5F9">Wake-up behavior</text>

    <text x="18" y="62" class="font-sans" font-size="13.5" fill="#F1F5F9">Sunrise screen brightness</text>
    <text x="18" y="80" class="font-sans" font-size="11.5" fill="#94A3B8">Warm amber glow 10 min before alarm</text>
    <g transform="translate(302,48)"><rect x="0" y="0" width="52" height="32" rx="16" fill="#93A8C7" stroke="none" stroke-width="1.2"/><circle cx="36" cy="16" r="11" fill="#0B1320"/></g>

    <line x1="18" y1="100" x2="354" y2="100" stroke="#1E293B"/>

    <text x="18" y="128" class="font-sans" font-size="13.5" fill="#F1F5F9">Auto-end bedtime mode</text>
    <text x="18" y="146" class="font-sans" font-size="11.5" fill="#94A3B8">Restore normal display when dismissed</text>
    <g transform="translate(302,114)"><rect x="0" y="0" width="52" height="32" rx="16" fill="#93A8C7" stroke="none" stroke-width="1.2"/><circle cx="36" cy="16" r="11" fill="#0B1320"/></g>
  </g>
  <g id="layer-bottom-navigation" transform="translate(0, 835)">
