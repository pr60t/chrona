<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 412 915" width="412" height="915">
  <title>CHRONA — Bedtime Reminder &amp; Wind-Down</title>
  <desc>Active bedtime reminder showing suggested bedtime, planned wake-up, planned sleep duration, Start winding down CTA, and dismissed state.</desc>
  <defs>
    <style>
      .font-sans { font-family: Google Sans, Roboto, -apple-system, BlinkMacSystemFont, sans-serif; }
      .font-mono { font-family: Roboto Mono, monospace; }
      .tnum { font-variant-numeric: tabular-nums; }
    </style>
    <radialGradient id="moonlight-halo" cx="50%" cy="22%" r="48%">
      <stop offset="0%" stop-color="#D4B8F0" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#93A8C7" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip-screen-412x915">
      <rect x="0" y="0" width="412" height="915" rx="36" ry="36"/>
    </clipPath>
  </defs>
  <g id="layer-amoled-canvas" clip-path="url(#clip-screen-412x915)">
    <rect x="0" y="0" width="412" height="915" fill="#000000"/>
    <rect x="0" y="0" width="412" height="420" fill="url(#moonlight-halo)"/>
  <g id="layer-status-bar">
    <text x="24" y="26" class="font-sans tnum" font-size="13" font-weight="600" fill="#F1F5F9">22:15</text>
    <text x="206" y="26" text-anchor="middle" class="font-mono" font-size="9" fill="#64748B">KATHMANDU · UTC +5:45</text>
    <path d="M352 25 l4 -4 l4 4 M350 22 a8 8 0 0 1 12 0" fill="none" stroke="#F1F5F9" stroke-width="1.4" stroke-linecap="round"/>
    <rect x="370" y="17" width="18" height="10" rx="2.5" fill="none" stroke="#F1F5F9" stroke-width="1.3"/>
    <rect x="372" y="19" width="13" height="6" rx="1" fill="#F1F5F9"/>
  </g>
  <g id="layer-top-app-bar">
    <g transform="translate(16,54) scale(1.000)" fill="none" stroke="#F1F5F9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></g>
    <text x="52" y="72" class="font-sans" font-size="22" font-weight="500" fill="#F1F5F9">Bedtime reminder</text>
    <g transform="translate(368,54) scale(1.000)" fill="none" stroke="#F1F5F9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="19" r="1.5" fill="currentColor" stroke="none"/></g>
  </g>
<g id="moonlight-illustration" transform="translate(20,92)" opacity="1.0">
      <rect x="0" y="0" width="372" height="108" rx="20" fill="#080B10" stroke="#1E293B"/>
      <!-- Soft concentric lunar rings -->
      <circle cx="62" cy="52" r="36" fill="#D4B8F0" fill-opacity="0.06"/>
      <circle cx="62" cy="52" r="24" fill="#D4B8F0" fill-opacity="0.10"/>
      <!-- Crescent Moon -->
      <path d="M68 38 A15 15 0 1 0 76 62 A12 12 0 1 1 68 38 Z" fill="#D4B8F0"/>
      <!-- Subtle Twinkling Stars -->
      <circle cx="118" cy="28" r="1.5" fill="#DCE6F7" opacity="0.7"/>
      <circle cx="156" cy="44" r="1.2" fill="#B8C7F2" opacity="0.5"/>
      <circle cx="294" cy="24" r="1.6" fill="#D4B8F0" opacity="0.75"/>
      <circle cx="332" cy="38" r="1.2" fill="#DCE6F7" opacity="0.55"/>
      <!-- Gentle Rolling Ridge -->
      <path d="M0 92 Q 96 68, 198 84 T 372 78 L 372 110 L 0 110 Z" fill="#11161F"/>
    </g>  <g transform="translate(20, 92)">
    <rect x="112" y="18" width="124" height="22" rx="11" fill="#2A384D"/>
    <text x="174" y="33" text-anchor="middle" class="font-mono" font-size="10" font-weight="600" fill="#D4B8F0">REMINDER ACTIVE</text>
    <text x="112" y="64" class="font-sans" font-size="18" font-weight="600" fill="#F1F5F9">Time to wind down</text>
    <text x="112" y="84" class="font-sans" font-size="12" fill="#94A3B8">30 minutes until your suggested bedtime</text>
  </g>

  <!-- Suggested Bedtime, Planned Wake-Up &amp; Planned Duration Card -->
  <g id="bedtime-reminder-metrics" transform="translate(20, 216)">
    <rect x="0" y="0" width="372" height="196" rx="22" fill="#1A202C" stroke="#D4B8F0" stroke-width="1.2"/>
    <g transform="translate(20, 22)">
      <text x="0" y="14" class="font-mono" font-size="10.5" font-weight="600" fill="#D4B8F0">SUGGESTED BEDTIME</text>
      <text x="0" y="54" class="font-sans tnum" font-size="38" font-weight="500" fill="#F1F5F9">22:30</text>
    </g>
    <line x1="186" y1="22" x2="186" y2="86" stroke="#1E293B"/>
    <g transform="translate(204, 22)">
      <text x="0" y="14" class="font-mono" font-size="10.5" font-weight="600" fill="#93A8C7">PLANNED WAKE-UP</text>
      <text x="0" y="54" class="font-sans tnum" font-size="38" font-weight="500" fill="#F1F5F9">06:30</text>
    </g>

    <line x1="20" y1="104" x2="352" y2="104" stroke="#1E293B"/>
    <text x="20" y="132" class="font-sans" font-size="13.5" fill="#94A3B8">Planned sleep duration</text>
    <text x="352" y="132" text-anchor="end" class="font-sans tnum" font-size="16" font-weight="600" fill="#D4B8F0">8 hrs 00 min</text>
    <text x="20" y="162" class="font-sans" font-size="12" fill="#94A3B8">Silences notifications &amp; dims screen grayscale</text>
  </g>

  <!-- Primary Action: Start Winding Down + Secondary Dismiss -->
  <g id="reminder-actions" transform="translate(20, 434)">
    <rect x="0" y="0" width="372" height="54" rx="27" fill="#93A8C7"/>
    <g transform="translate(88,16) scale(0.917)" fill="none" stroke="#0B1320" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M19.5 14.5A7.5 7.5 0 0 1 9.5 4.5a7.5 7.5 0 1 0 10 10z"/></g>
    <text x="204" y="32" text-anchor="middle" class="font-sans" font-size="15" font-weight="600" fill="#0B1320">Start winding down</text>

    <rect x="0" y="68" width="372" height="46" rx="23" fill="#222A38" stroke="#334155"/>
    <text x="186" y="96" text-anchor="middle" class="font-sans" font-size="14" font-weight="500" fill="#F1F5F9">Dismiss reminder</text>
  </g>

  <!-- Reminder Dismissed State Preview Strip -->
  <g id="reminder-dismissed-state-card" transform="translate(20, 574)">
    <rect x="0" y="0" width="372" height="64" rx="18" fill="#11161F" stroke="#1E293B"/>
    <g transform="translate(16,22) scale(0.833)" fill="none" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></g>
    <text x="46" y="28" class="font-mono" font-size="10.5" font-weight="600" fill="#94A3B8">REMINDER DISMISSED STATE</text>
    <text x="46" y="47" class="font-sans" font-size="12" fill="#64748B">Wake-up alarm remains active for 06:30 tomorrow</text>
  </g>
  <g id="layer-bottom-navigation" transform="translate(0, 835)">
    <rect x="0" y="0" width="412" height="80" fill="#11161F"/>
    <line x1="0" y1="0" x2="412" y2="0" stroke="#1E293B" stroke-width="1"/>
    <g id="nav-dest-1-alarms">
      
      <g transform="translate(29.200000000000003,14) scale(1.000)" fill="none" stroke="#94A3B8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 1.5M5 3L2 6M22 6l-3-3M6.5 19.5L5 21M17.5 19.5L19 21"/></g>
      <text x="41.2" y="59" text-anchor="middle" class="font-sans" font-size="11" font-weight="500" fill="#94A3B8">Alarms</text>
    </g>
    <g id="nav-dest-2-world-clock">
      
      <g transform="translate(111.60000000000001,14) scale(1.000)" fill="none" stroke="#94A3B8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3.6 9h16.8M3.6 15h16.8M11.5 3a17 17 0 0 0 0 18M12.5 3a17 17 0 0 1 0 18"/></g>
      <text x="123.6" y="59" text-anchor="middle" class="font-sans" font-size="11" font-weight="500" fill="#94A3B8">World Clock</text>
    </g>
    <g id="nav-dest-3-timer">
      
      <g transform="translate(194.0,14) scale(1.000)" fill="none" stroke="#94A3B8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12M6 21h12M7 3v3.5a5 5 0 0 0 2.2 4.1L12 12.5l2.8-1.9A5 5 0 0 0 17 6.5V3M7 21v-3.5a5 5 0 0 1 2.2-4.1L12 11.5l2.8 1.9a5 5 0 0 1 2.2 4.1V21"/></g>
      <text x="206.0" y="59" text-anchor="middle" class="font-sans" font-size="11" font-weight="500" fill="#94A3B8">Timer</text>
    </g>
    <g id="nav-dest-4-stopwatch">
      
      <g transform="translate(276.40000000000003,14) scale(1.000)" fill="none" stroke="#94A3B8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M10 2h4M12 9v4M18 6l1.5-1.5"/></g>
      <text x="288.4" y="59" text-anchor="middle" class="font-sans" font-size="11" font-weight="500" fill="#94A3B8">Stopwatch</text>
    </g>
    <g id="nav-dest-5-bedtime">
      <rect x="342.8" y="10" width="56" height="32" rx="16" fill="#2A384D"/>
      <g transform="translate(358.8,14) scale(1.000)" fill="none" stroke="#DCE6F7" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M19.5 14.5A7.5 7.5 0 0 1 9.5 4.5a7.5 7.5 0 1 0 10 10z"/></g>
      <text x="370.8" y="59" text-anchor="middle" class="font-sans" font-size="11" font-weight="600" fill="#F1F5F9">Bedtime</text>
    </g>
  </g>
  </g>
</svg>