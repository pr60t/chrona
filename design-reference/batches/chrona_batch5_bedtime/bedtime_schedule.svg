<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 412 915" width="412" height="915">
  <title>CHRONA — Sleep Schedule Editor</title>
  <desc>Interactive circular sleep arc with bedtime and wake-up selectors, 8h 00m duration readout, repeat weekday selector, and Save button.</desc>
  <defs>
    <style>
      .font-sans { font-family: Google Sans, Roboto, -apple-system, BlinkMacSystemFont, sans-serif; }
      .font-mono { font-family: Roboto Mono, monospace; }
      .tnum { font-variant-numeric: tabular-nums; }
    </style>
    <radialGradient id="moonlight-halo" cx="50%" cy="22%" r="48%">
      <stop offset="0%" stop-color="#D4B8F0" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#93A8C7" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip-screen-412x915">
      <rect x="0" y="0" width="412" height="915" rx="36" ry="36"/>
    </clipPath>
  </defs>
  <g id="layer-amoled-canvas" clip-path="url(#clip-screen-412x915)">
    <rect x="0" y="0" width="412" height="915" fill="#000000"/>
    <rect x="0" y="0" width="412" height="420" fill="url(#moonlight-halo)"/>
  <g id="layer-status-bar">
    <text x="24" y="26" class="font-sans tnum" font-size="13" font-weight="600" fill="#F1F5F9">22:15</text>
    <text x="206" y="26" text-anchor="middle" class="font-mono" font-size="9" fill="#64748B">KATHMANDU · UTC +5:45</text>
    <path d="M352 25 l4 -4 l4 4 M350 22 a8 8 0 0 1 12 0" fill="none" stroke="#F1F5F9" stroke-width="1.4" stroke-linecap="round"/>
    <rect x="370" y="17" width="18" height="10" rx="2.5" fill="none" stroke="#F1F5F9" stroke-width="1.3"/>
    <rect x="372" y="19" width="13" height="6" rx="1" fill="#F1F5F9"/>
  </g>
  <g id="layer-top-app-bar">
    <g transform="translate(16,54) scale(1.000)" fill="none" stroke="#F1F5F9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></g>
    <text x="52" y="72" class="font-sans" font-size="22" font-weight="500" fill="#F1F5F9">Edit sleep schedule</text>
    <text x="392" y="71" text-anchor="end" class="font-sans" font-size="14" font-weight="600" fill="#93A8C7">Save</text>
  </g>
  <g id="sleep-schedule-circular-editor" transform="translate(0, 92)">
    <g id="sleep-schedule-dial">
      <circle cx="206" cy="138" r="114" fill="#080B10" stroke="#222A38" stroke-width="12"/>
      <path d="M 125.4 57.4 A 114 114 0 0 1 319.2 151.9" fill="none" stroke="#D4B8F0" stroke-width="12" stroke-linecap="round"/>
      <!-- Bedtime Handle Node -->
      <circle cx="125.4" cy="57.4" r="12" fill="#2B3547" stroke="#D4B8F0" stroke-width="2"/>
      <g transform="translate(118.38982694473357,50.389826944733585) scale(0.583)" fill="none" stroke="#D4B8F0" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M19.5 14.5A7.5 7.5 0 0 1 9.5 4.5a7.5 7.5 0 1 0 10 10z"/></g>
      <!-- Wake-up Handle Node -->
      <circle cx="319.2" cy="151.9" r="12" fill="#2B3547" stroke="#93A8C7" stroke-width="2"/>
      <g transform="translate(312.1502612871107,144.89310514818683) scale(0.583)" fill="none" stroke="#93A8C7" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></g>
    </g>
    <text x="206" y="124" text-anchor="middle" class="font-mono" font-size="10.5" font-weight="600" fill="#D4B8F0">SLEEP DURATION</text>
    <text x="206" y="156" text-anchor="middle" class="font-sans tnum" font-size="30" font-weight="600" fill="#F1F5F9">8h 00m</text>
    <text x="206" y="176" text-anchor="middle" class="font-sans" font-size="11.5" fill="#6EE7B7">Meets 8h target</text>
  </g>
  <g id="bedtime-wakeup-selectors" transform="translate(20, 382)">
    <!-- Bedtime Selector -->
    <rect x="0" y="0" width="180" height="104" rx="20" fill="#1A202C" stroke="#D4B8F0" stroke-width="1.3"/>
    <g transform="translate(16,16) scale(0.750)" fill="none" stroke="#D4B8F0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19.5 14.5A7.5 7.5 0 0 1 9.5 4.5a7.5 7.5 0 1 0 10 10z"/></g>
    <text x="42" y="30" class="font-mono" font-size="10.5" font-weight="600" fill="#D4B8F0">BEDTIME</text>
    <text x="18" y="72" class="font-sans tnum" font-size="34" font-weight="500" fill="#F1F5F9">22:30</text>
    <text x="18" y="92" class="font-sans" font-size="11.5" fill="#94A3B8">Tap to adjust</text>

    <!-- Wake-up Selector -->
    <rect x="192" y="0" width="180" height="104" rx="20" fill="#1A202C" stroke="#93A8C7" stroke-width="1.3"/>
    <g transform="translate(208,16) scale(0.750)" fill="none" stroke="#93A8C7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></g>
    <text x="234" y="30" class="font-mono" font-size="10.5" font-weight="600" fill="#93A8C7">WAKE-UP</text>
    <text x="210" y="72" class="font-sans tnum" font-size="34" font-weight="500" fill="#F1F5F9">06:30</text>
    <text x="210" y="92" class="font-sans" font-size="11.5" fill="#94A3B8">Alarm active</text>
  </g>
  <g id="schedule-editor-repeat-days" transform="translate(20, 500)">
    <rect x="0" y="0" width="372" height="114" rx="20" fill="#1A202C" stroke="#1E293B"/>
    <text x="18" y="28" class="font-sans" font-size="14" font-weight="600" fill="#F1F5F9">Repeat days</text>
    <text x="354" y="28" text-anchor="end" class="font-sans" font-size="12.5" font-weight="500" fill="#93A8C7">Weekdays</text>
    <g id="component-weekday-selector" transform="translate(18,48)">
  <circle cx="19.0" cy="19" r="18" fill="#222A38" stroke="#334155"/>
  <text x="19.0" y="24" text-anchor="middle" class="font-sans" font-size="12" font-weight="600" fill="#94A3B8">S</text>
  <circle cx="67.5" cy="19" r="18" fill="#93A8C7" stroke="none"/>
  <text x="67.5" y="24" text-anchor="middle" class="font-sans" font-size="12" font-weight="600" fill="#0B1320">M</text>
  <circle cx="116.0" cy="19" r="18" fill="#93A8C7" stroke="none"/>
  <text x="116.0" y="24" text-anchor="middle" class="font-sans" font-size="12" font-weight="600" fill="#0B1320">T</text>
  <circle cx="164.5" cy="19" r="18" fill="#93A8C7" stroke="none"/>
  <text x="164.5" y="24" text-anchor="middle" class="font-sans" font-size="12" font-weight="600" fill="#0B1320">W</text>
  <circle cx="213.0" cy="19" r="18" fill="#93A8C7" stroke="none"/>
  <text x="213.0" y="24" text-anchor="middle" class="font-sans" font-size="12" font-weight="600" fill="#0B1320">T</text>
  <circle cx="261.5" cy="19" r="18" fill="#93A8C7" stroke="none"/>
  <text x="261.5" y="24" text-anchor="middle" class="font-sans" font-size="12" font-weight="600" fill="#0B1320">F</text>
  <circle cx="310.0" cy="19" r="18" fill="#222A38" stroke="#334155"/>
  <text x="310.0" y="24" text-anchor="middle" class="font-sans" font-size="12" font-weight="600" fill="#94A3B8">S</text>
</g>

  </g>
  <g id="cta-save-sleep-schedule" transform="translate(20, 766)">
    <rect x="0" y="0" width="372" height="52" rx="26" fill="#93A8C7"/>
    <g transform="translate(112,15) scale(0.917)" fill="none" stroke="#0B1320" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></g>
    <text x="206" y="31" text-anchor="middle" class="font-sans" font-size="15" font-weight="600" fill="#0B1320">Save schedule</text>
  </g>
  <g id="layer-bottom-navigation" transform="translate(0, 835)">
    <rect x="0" y="0" width="412" height="80" fill="#11161F"/>
    <line x1="0" y1="0" x2="412" y2="0" stroke="#1E293B" stroke-width="1"/>
    <g id="nav-dest-1-alarms">
      
      <g transform="translate(29.200000000000003,14) scale(1.000)" fill="none" stroke="#94A3B8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 1.5M5 3L2 6M22 6l-3-3M6.5 19.5L5 21M17.5 19.5L19 21"/></g>
      <text x="41.2" y="59" text-anchor="middle" class="font-sans" font-size="11" font-weight="500" fill="#94A3B8">Alarms</text>
    </g>
    <g id="nav-dest-2-world-clock">
      
      <g transform="translate(111.60000000000001,14) scale(1.000)" fill="none" stroke="#94A3B8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3.6 9h16.8M3.6 15h16.8M11.5 3a17 17 0 0 0 0 18M12.5 3a17 17 0 0 1 0 18"/></g>
      <text x="123.6" y="59" text-anchor="middle" class="font-sans" font-size="11" font-weight="500" fill="#94A3B8">World Clock</text>
    </g>
    <g id="nav-dest-3-timer">
      
      <g transform="translate(194.0,14) scale(1.000)" fill="none" stroke="#94A3B8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12M6 21h12M7 3v3.5a5 5 0 0 0 2.2 4.1L12 12.5l2.8-1.9A5 5 0 0 0 17 6.5V3M7 21v-3.5a5 5 0 0 1 2.2-4.1L12 11.5l2.8 1.9a5 5 0 0 1 2.2 4.1V21"/></g>
      <text x="206.0" y="59" text-anchor="middle" class="font-sans" font-size="11" font-weight="500" fill="#94A3B8">Timer</text>
    </g>
    <g id="nav-dest-4-stopwatch">
      
      <g transform="translate(276.40000000000003,14) scale(1.000)" fill="none" stroke="#94A3B8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M10 2h4M12 9v4M18 6l1.5-1.5"/></g>
      <text x="288.4" y="59" text-anchor="middle" class="font-sans" font-size="11" font-weight="500" fill="#94A3B8">Stopwatch</text>
    </g>
    <g id="nav-dest-5-bedtime">
      <rect x="342.8" y="10" width="56" height="32" rx="16" fill="#2A384D"/>
      <g transform="translate(358.8,14) scale(1.000)" fill="none" stroke="#DCE6F7" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M19.5 14.5A7.5 7.5 0 0 1 9.5 4.5a7.5 7.5 0 1 0 10 10z"/></g>
      <text x="370.8" y="59" text-anchor="middle" class="font-sans" font-size="11" font-weight="600" fill="#F1F5F9">Bedtime</text>
    </g>
  </g>
  </g>
</svg>