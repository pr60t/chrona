<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <title>CHRONA — Pixel Atlas World Clock Widget (2×2)</title>
  <desc>Minimal digital world-clock hardware instrument showing UTC, Tokyo, Paris, and Munich in a balanced 2×2 grid with square solar-phase pixel indicators.</desc>
  <g id="widget-pixel-atlas">
    <!-- Outer Hardware Enclosure -->
    <rect id="atlas-enclosure" x="14" y="14" width="372" height="372" rx="44" ry="44" fill="#202022"/>
    <rect id="atlas-inner-bezel" x="14.5" y="14.5" width="371" height="371" rx="43.5" ry="43.5" fill="none" stroke="#2D2E34" stroke-width="1"/>

    <!-- Top Header Bar -->
    <g id="atlas-header">
      <text id="atlas-title" x="42" y="56" fill="#929AAA" font-family="Inter, Roboto, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="2.2">WORLD CLOCK</text>
      <!-- Signature 4-pixel micro-matrix on top-right mirroring the 4 cells -->
      <g id="atlas-header-pixels" transform="translate(338, 43)">
        <rect x="0" y="0" width="5" height="5" rx="1" fill="#7C8292"/>
        <rect x="8" y="0" width="5" height="5" rx="1" fill="#96A8E8"/>
        <rect x="0" y="8" width="5" height="5" rx="1" fill="#E8B872"/>
        <rect x="8" y="8" width="5" height="5" rx="1" fill="#E8B872"/>
      </g>
    </g>

    <!-- Subtle Hairline Separators -->
    <g id="atlas-separators" stroke="#2E2F34" stroke-width="1" stroke-linecap="round">
      <line x1="42" y1="74" x2="358" y2="74"/>
      <line x1="200" y1="90" x2="200" y2="354"/>
      <line x1="42" y1="222" x2="358" y2="222"/>
    </g>

    <!-- Cell 1 (Top-Left): UTC (Etc/UTC) — Neutral Grey Pixel -->
    <g id="cell-utc" transform="translate(42, 96)">
      <rect id="pixel-utc" x="0" y="3" width="8" height="8" rx="1.5" fill="#7C8292"/>
      <text id="city-utc" x="16" y="11" fill="#929AAA" font-family="Inter, Roboto, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1.4">UTC</text>
      <text id="time-utc" x="0" y="64" fill="#DFE2F3" font-family="Roboto Mono, JetBrains Mono, Inter, monospace" font-size="44" font-weight="400" letter-spacing="-1.5">14:18</text>
      <text id="day-utc" x="0" y="90" fill="#929AAA" font-family="Inter, Roboto, Arial, sans-serif" font-size="11.5" font-weight="500" letter-spacing="1.1">FRI · +0H</text>
    </g>

    <!-- Cell 2 (Top-Right): TOKYO (Asia/Tokyo) — Night Periwinkle Pixel -->
    <g id="cell-tokyo" transform="translate(218, 96)">
      <rect id="pixel-tokyo" x="0" y="3" width="8" height="8" rx="1.5" fill="#96A8E8"/>
      <text id="city-tokyo" x="16" y="11" fill="#929AAA" font-family="Inter, Roboto, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1.4">TOKYO</text>
      <text id="time-tokyo" x="0" y="64" fill="#DFE2F3" font-family="Roboto Mono, JetBrains Mono, Inter, monospace" font-size="44" font-weight="400" letter-spacing="-1.5">23:18</text>
      <text id="day-tokyo" x="0" y="90" fill="#929AAA" font-family="Inter, Roboto, Arial, sans-serif" font-size="11.5" font-weight="500" letter-spacing="1.1">FRI · +9H</text>
    </g>

    <!-- Cell 3 (Bottom-Left): PARIS (Europe/Paris) — Day Warm Amber Pixel -->
    <g id="cell-paris" transform="translate(42, 244)">
      <rect id="pixel-paris" x="0" y="3" width="8" height="8" rx="1.5" fill="#E8B872"/>
      <text id="city-paris" x="16" y="11" fill="#929AAA" font-family="Inter, Roboto, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1.4">PARIS</text>
      <text id="time-paris" x="0" y="64" fill="#DFE2F3" font-family="Roboto Mono, JetBrains Mono, Inter, monospace" font-size="44" font-weight="400" letter-spacing="-1.5">15:18</text>
      <text id="day-paris" x="0" y="90" fill="#929AAA" font-family="Inter, Roboto, Arial, sans-serif" font-size="11.5" font-weight="500" letter-spacing="1.1">FRI · +1H</text>
    </g>

    <!-- Cell 4 (Bottom-Right): MUNICH (Europe/Berlin) — Day Warm Amber Pixel -->
    <g id="cell-munich" transform="translate(218, 244)">
      <rect id="pixel-munich" x="0" y="3" width="8" height="8" rx="1.5" fill="#E8B872"/>
      <text id="city-munich" x="16" y="11" fill="#929AAA" font-family="Inter, Roboto, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1.4">MUNICH</text>
      <text id="time-munich" x="0" y="64" fill="#DFE2F3" font-family="Roboto Mono, JetBrains Mono, Inter, monospace" font-size="44" font-weight="400" letter-spacing="-1.5">15:18</text>
      <text id="day-munich" x="0" y="90" fill="#929AAA" font-family="Inter, Roboto, Arial, sans-serif" font-size="11.5" font-weight="500" letter-spacing="1.1">FRI · +1H</text>
    </g>
  </g>
</svg>
