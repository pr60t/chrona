<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 480 540" width="480" height="540">
  <title>CHRONA Widget Preview — Stopwatch (2 × 2)</title>
  <desc>Widget-picker preview card for Stopwatch (2 × 2) on neutral dark-grey picker surface.</desc>

  <rect id="picker-preview-bg" x="0" y="0" width="480" height="540" rx="28" fill="#141416"/>
  <g id="preview-widget-stage" transform="translate(40, 32)">
<g id="widget-stopwatch">
    <!-- Main Circular Body -->
    <circle id="stopwatch-dial" cx="200" cy="204" r="168" fill="#202022"/>

    <!-- Centred Elapsed Time Display -->
    <text id="stopwatch-elapsed-time" x="200" y="222" text-anchor="middle" fill="#DFE2F3" font-family="Inter, Roboto, Arial, sans-serif" font-size="68" font-weight="400" letter-spacing="-1">00:00</text>

    <!-- Upper-Right Overlapping Light-Lavender Pill (Lap + Reset) -->
    <g id="stopwatch-upper-pill" transform="translate(226, 22)">
      <rect x="0" y="0" width="150" height="66" rx="33" ry="33" fill="#DCE2FA"/>
      <!-- Left Icon: Stopwatch / Lap -->
      <g id="btn-lap-icon" transform="translate(30, 19)" fill="none" stroke="#1B1B1D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="11" y1="2" x2="17" y2="2"/>
        <line x1="14" y1="2" x2="14" y2="5"/>
        <circle cx="14" cy="15" r="9.5"/>
        <polyline points="14 10.5 14 15 17.5 17"/>
      </g>
      <!-- Subtle vertical divider inside pill -->
      <line x1="75" y1="18" x2="75" y2="48" stroke="#1B1B1D" stroke-opacity="0.16" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Right Icon: Reset (Circular Refresh Arrow) -->
      <g id="btn-reset-icon" transform="translate(92, 19)" fill="none" stroke="#1B1B1D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 13 A9 9 0 1 1 7.6 19.4"/>
        <polyline points="5 8 5 13.5 10.5 13.5"/>
      </g>
    </g>

    <!-- Lower-Left Overlapping Light-Lavender Rounded-Square Play Button -->
    <g id="stopwatch-lower-play-btn" transform="translate(24, 274)">
      <rect x="0" y="0" width="104" height="104" rx="30" ry="30" fill="#DCE2FA"/>
      <!-- Dark Triangular Play Icon -->
      <path id="btn-play-triangle" d="M42,34.5 C42,32.8 43.9,31.8 45.3,32.7 L69.5,48.2 C70.8,49.0 70.8,51.0 69.5,51.8 L45.3,67.3 C43.9,68.2 42,67.2 42,65.5 Z" fill="#1B1B1D"/>
    </g>
  </g>
  </g>
  <text id="preview-widget-name" x="240" y="472" text-anchor="middle" fill="#DFE2F3" font-family="Inter, Roboto, Arial, sans-serif" font-size="18" font-weight="500">Stopwatch</text>
  <text id="preview-widget-size" x="240" y="498" text-anchor="middle" fill="#929AAA" font-family="Inter, Roboto, Arial, sans-serif" font-size="14" font-weight="400">2 × 2</text>
</svg>
