<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 400" width="400" height="400">
  <title>CHRONA Light — Digital Clock Widget (2×2)</title>
  <desc>Light-theme wide horizontal oval pale lavender-grey digital clock with centred date, large thin charcoal time display, and Pixel lavender alarm indicator.</desc>
  <defs>
    <symbol id="sym-alarm" viewBox="0 0 24 24">
      <circle cx="12" cy="13" r="7.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <polyline points="12 9.5 12 13 14.5 14.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M5.2 4.2 L2.8 6.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <path d="M18.8 4.2 L21.2 6.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </symbol>
  </defs>
  <g id="widget-digital-light">
    <ellipse id="digital-oval-surface" cx="200" cy="200" rx="188" ry="114" fill="#E8EBFA" stroke="#DCE2FA" stroke-width="1"/>
    <text id="digital-date" x="200" y="138" text-anchor="middle" fill="#686B78" font-family="Inter, Roboto, Arial, sans-serif" font-size="15.5" font-weight="500" letter-spacing="0.3">Fri, Nov 20</text>
    <text id="digital-time" x="200" y="232" text-anchor="middle" fill="#202127" font-family="Inter, Roboto, Arial, sans-serif" font-size="98" font-weight="300" letter-spacing="-2">10:10</text>
    <g id="digital-alarm-row" transform="translate(162, 260)" color="#5966A8">
      <use href="#sym-alarm" xlink:href="#sym-alarm" x="0" y="0" width="18" height="18"/>
      <text id="digital-alarm-time" x="24" y="14.5" fill="#686B78" font-family="Inter, Roboto, Arial, sans-serif" font-size="15.5" font-weight="500">07:30</text>
    </g>
  </g>
</svg>
