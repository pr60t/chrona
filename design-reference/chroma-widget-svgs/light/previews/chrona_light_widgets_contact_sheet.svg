  <g id="slot-pixel-atlas-light" transform="translate(336, 1092)">
    <g transform="scale(0.92)">
<g id="widget-pixel-atlas-light">
    <!-- Outer Hardware Enclosure -->
    <rect id="atlas-enclosure" x="14" y="14" width="372" height="372" rx="44" ry="44" fill="#FFFFFF"/>
    <rect id="atlas-inner-bezel" x="14.5" y="14.5" width="371" height="371" rx="43.5" ry="43.5" fill="none" stroke="#E0E2E9" stroke-width="1"/>

    <!-- Top Header Bar -->
    <g id="atlas-header">
      <text id="atlas-title" x="42" y="56" fill="#686B78" font-family="Inter, Roboto, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="2.2">WORLD CLOCK</text>
      <!-- Signature 4-pixel micro-matrix on top-right mirroring the 4 cells -->
      <g id="atlas-header-pixels" transform="translate(338, 43)">
        <rect x="0" y="0" width="5" height="5" rx="1" fill="#888B98"/>
        <rect x="8" y="0" width="5" height="5" rx="1" fill="#6B7FD4"/>
        <rect x="0" y="8" width="5" height="5" rx="1" fill="#D99B3C"/>
        <rect x="8" y="8" width="5" height="5" rx="1" fill="#D99B3C"/>
      </g>
    </g>

    <!-- Subtle Hairline Separators -->
    <g id="atlas-separators" stroke="#E0E2E9" stroke-width="1" stroke-linecap="round">
      <line x1="42" y1="74" x2="358" y2="74"/>
      <line x1="200" y1="90" x2="200" y2="354"/>
      <line x1="42" y1="222" x2="358" y2="222"/>
    </g>

    <!-- Cell 1 (Top-Left): UTC (Etc/UTC) — Neutral Grey Pixel -->
